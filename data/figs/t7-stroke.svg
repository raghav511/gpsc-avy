<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 774" width="760" height="774" role="img" aria-label="Stroke territories on a side view of the brain: the middle cerebral artery supplies most of the lateral surface including the face and arm areas (commonest site; contralateral weakness, face and arm more than leg, aphasia if dominant), the anterior cerebral artery the leg area along the top (leg more than arm), and the posterior cerebral artery the occipital lobe (homonymous hemianopia with macular sparing). Two faces compare facial palsy: in a stroke (upper motor neurone) the forehead is spared, in Bell&#x27;s palsy (lower motor neurone) the whole half of the face including the forehead is weak and the eye does not close."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="774" rx="18" class="bg"/><text x="24" y="36" class="t">Stroke territories and facial palsy</text><text x="24" y="58" class="s">Which artery, which weakness; does the forehead move?</text><rect x="24" y="76" width="712" height="300" rx="14" class="pn"/><g transform="translate(190 236) scale(1.1)"><path d="M-128 12 C-136 -44 -92 -98 -20 -104 C52 -110 116 -76 130 -24 C140 14 122 44 92 54 C70 66 40 70 18 64 C0 74 -50 74 -80 60 C-112 52 -126 36 -128 12 Z" fill="#F3E1DC" stroke="#A88A84" stroke-width="2"/><clipPath id="brc"><path d="M-128 12 C-136 -44 -92 -98 -20 -104 C52 -110 116 -76 130 -24 C140 14 122 44 92 54 C70 66 40 70 18 64 C0 74 -50 74 -80 60 C-112 52 -126 36 -128 12 Z"/></clipPath><g clip-path="url(#brc)"><path d="M-120 -40 C-90 -70 -20 -84 40 -78 C80 -70 104 -40 110 -10 C96 20 60 40 20 44 C-20 50 -70 44 -110 30 Z" fill="#E46F67" opacity=".55"/><path d="M-60 -104 C-20 -110 30 -110 60 -100 L50 -84 C10 -92 -30 -92 -56 -88 Z" fill="#2E68D8" opacity=".45"/><path d="M96 -60 C120 -40 136 -10 130 20 C118 40 100 50 88 54 C92 20 92 -20 96 -60 Z" fill="#7845C8" opacity=".45"/></g><path d="M-110 20 C-70 0 -20 -8 30 -4" stroke="#A88A84" stroke-width="2" fill="none"/><path d="M10 -104 C0 -70 -6 -40 -2 -10" stroke="#A88A84" stroke-width="2" fill="none"/><path d="M60 60 C80 80 110 84 124 64 C130 52 120 46 104 50 Z" fill="#E7CFC9" stroke="#A88A84" stroke-width="1.6"/><path d="M30 64 L34 104 L50 104 L52 66" fill="#E7CFC9" stroke="#A88A84" stroke-width="1.6"/></g><text x="40" y="104" class="n sm b">Side view of the left hemisphere</text><path d="M118 340L140 260" class="ln" stroke-width="1.2" fill="none"/><circle cx="140" cy="260" r="2.6" class="lnf"/><text x="118" y="356" class="n sm b red" text-anchor="middle">MCA territory: face and arm</text><path d="M260 110L210 128" class="ln" stroke-width="1.2" fill="none"/><circle cx="210" cy="128" r="2.6" class="lnf"/><text x="266" y="108" class="n sm b blu">ACA strip: leg area</text><path d="M330 338L300 246" class="ln" stroke-width="1.2" fill="none"/><circle cx="300" cy="246" r="2.6" class="lnf"/><text x="330" y="354" class="n sm b pur" text-anchor="middle">PCA: occipital, vision</text><rect x="420" y="100" width="14" height="14" rx="4" class="red" opacity=".7"/><text x="442" y="112" class="l b red">Middle cerebral artery</text><text x="442" y="130" class="n sm">COMMONEST site. Opposite-side weakness,</text><text x="442" y="146" class="n sm">face and arm &gt; leg; aphasia if dominant side</text><rect x="420" y="166" width="14" height="14" rx="4" class="blu" opacity=".7"/><text x="442" y="178" class="l b blu">Anterior cerebral artery</text><text x="442" y="196" class="n sm">Leg &gt; arm weakness</text><rect x="420" y="232" width="14" height="14" rx="4" class="pur" opacity=".7"/><text x="442" y="244" class="l b pur">Posterior cerebral artery</text><text x="442" y="262" class="n sm">Homonymous hemianopia, macular sparing</text><rect x="420" y="298" width="14" height="14" rx="4" class="amb" opacity=".7"/><text x="442" y="310" class="l b amb">Internal capsule</text><text x="442" y="328" class="n sm">Dense weakness of face, arm AND leg</text><text x="442" y="344" class="n sm">(lenticulostriate; hypertensive bleed)</text><rect x="24" y="392" width="350" height="344" rx="14" class="pn"/><rect x="386" y="392" width="350" height="344" rx="14" class="pn"/><g transform="translate(199 520)"><ellipse cx="0" cy="0" rx="62" ry="78" fill="url(#skin)" stroke="#B9826A" stroke-width="2"/><path d="M-58 -36 C-70 -110 70 -110 58 -36 C50 -70 -50 -70 -58 -36 Z" fill="#4A3426"/><path d="M-40 -40 q10 -4 20 0 M-40 -32 q10 -4 20 0" stroke="#B9826A" stroke-width="1.6" fill="none"/><path d="M20 -40 q10 -4 20 0 M20 -32 q10 -4 20 0" stroke="#B9826A" stroke-width="1.6" fill="none"/><ellipse cx="-24" cy="-12" rx="11" ry="6" fill="#fff" stroke="#5B4636"/><circle cx="-24" cy="-12" r="4" fill="#3A2A20"/><ellipse cx="24" cy="-12" rx="11" ry="6" fill="#fff" stroke="#5B4636"/><circle cx="24" cy="-12" r="4" fill="#3A2A20"/><path d="M-36 -24 q12 -6 24 0 M12 -24 q12 -6 24 0" stroke="#4A3426" stroke-width="2.4" fill="none"/><path d="M0 -6 L-6 18 L6 18" stroke="#B9826A" stroke-width="1.6" fill="none"/><path d="M-24 10 C-30 20 -30 28 -24 34" stroke="#B9826A" stroke-width="1.4" fill="none"/><path d="M-22 40 C-8 44 6 46 22 52" stroke="#A8322B" stroke-width="3" fill="none" stroke-linecap="round"/></g><g transform="translate(561 520)"><ellipse cx="0" cy="0" rx="62" ry="78" fill="url(#skin)" stroke="#B9826A" stroke-width="2"/><path d="M-58 -36 C-70 -110 70 -110 58 -36 C50 -70 -50 -70 -58 -36 Z" fill="#4A3426"/><path d="M-40 -40 q10 -4 20 0 M-40 -32 q10 -4 20 0" stroke="#B9826A" stroke-width="1.6" fill="none"/><ellipse cx="-24" cy="-12" rx="11" ry="6" fill="#fff" stroke="#5B4636"/><circle cx="-24" cy="-12" r="4" fill="#3A2A20"/><ellipse cx="24" cy="-10" rx="12" ry="8" fill="#fff" stroke="#5B4636"/><circle cx="24" cy="-14" r="4" fill="#3A2A20"/><path d="M-36 -24 q12 -6 24 0 M12 -24 q12 -6 24 0" stroke="#4A3426" stroke-width="2.4" fill="none"/><path d="M0 -6 L-6 18 L6 18" stroke="#B9826A" stroke-width="1.6" fill="none"/><path d="M-24 10 C-30 20 -30 28 -24 34" stroke="#B9826A" stroke-width="1.4" fill="none"/><path d="M-22 40 C-8 44 6 46 22 52" stroke="#A8322B" stroke-width="3" fill="none" stroke-linecap="round"/></g><text x="40" y="420" class="l b red">Stroke (UMN facial palsy)</text><text x="402" y="420" class="l b pur">Bell's palsy (LMN)</text><text x="40" y="636" class="n sm">Lower face droops on one side</text><text x="40" y="653" class="n sm">FOREHEAD SPARED: wrinkles on</text><text x="40" y="670" class="n sm">both sides</text><text x="402" y="636" class="n sm">WHOLE half of the face, forehead</text><text x="402" y="653" class="n sm">too: no wrinkles, eye will not close.</text><text x="402" y="670" class="n sm">Steroids within 72 h</text><text x="24" y="754" class="n sm">Non-contrast CT first in every acute stroke: it rules out bleeding before a clot-buster.</text></svg>