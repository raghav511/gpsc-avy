 50 -10 30 40 C20 30 -10 30 -26 46 Z" fill="#F2C9AE" stroke="#B9826A" stroke-width="2"/><path d="M24 -10 C40 0 44 20 30 26 M-20 -40 C-36 -30 -38 -10 -26 0" stroke="#B9826A" stroke-width="7" fill="none" stroke-linecap="round"/></g><path d="M-2 172 C-4 182 0 190 -2 198" stroke="#7E1F2F" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M-81 -84l-7 -7" stroke="#D33A3F" stroke-width="3" stroke-linecap="round"/><path d="M-36 -114l-3 -9" stroke="#D33A3F" stroke-width="3" stroke-linecap="round"/><path d="M40 -113l4 -9" stroke="#D33A3F" stroke-width="3" stroke-linecap="round"/><path d="M84 -81l8 -6" stroke="#D33A3F" stroke-width="3" stroke-linecap="round"/><path d="M108 -32l10 -2" stroke="#D33A3F" stroke-width="3" stroke-linecap="round"/><path d="M105 23l10 3" stroke="#D33A3F" stroke-width="3" stroke-linecap="round"/></g><text x="404" y="512" class="n sm b">PLACENTA</text><text x="496" y="512" class="l sm">Normal site, separates early;</text><text x="496" y="534" class="l sm">clot builds up behind it</text><text x="404" y="556" class="n sm b">BLEEDING</text><text x="496" y="556" class="l sm">PAINFUL</text><text x="404" y="578" class="n sm b">UTERUS</text><text x="496" y="578" class="l sm">Tense and tender</text><path d="M110 440L175 380" class="ln" stroke-width="1.2" fill="none"/><circle cx="175" cy="380" r="2.6" class="lnf"/><text x="110" y="456" class="n sm b blu" text-anchor="middle">placenta over the os</text><path d="M470 130L520 172" class="ln" stroke-width="1.2" fill="none"/><circle cx="520" cy="172" r="2.6" class="lnf"/><text x="470" y="124" class="n sm b red" text-anchor="middle">clot behind the placenta</text><text x="24" y="632" class="n sm">Antepartum haemorrhage = bleeding after 28 weeks of pregnancy (Indian definition).</text></svg>