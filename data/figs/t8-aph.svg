<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="Two causes of antepartum haemorrhage in a section of the pregnant uterus: placenta praevia, where the placenta lies low over the cervix and bleeding is painless, causeless, recurrent and bright red with a soft uterus; and abruptio placentae, where a normally placed placenta separates early with a clot behind it, and bleeding is painful with a tense, tender uterus."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="640" rx="18" class="bg"/><text x="24" y="36" class="t">Painless or painful bleeding?</text><text x="24" y="58" class="s">Placenta praevia vs abruptio placentae</text><rect x="24" y="76" width="350" height="540" rx="14" class="pn"/><text x="42" y="106" class="l b blu" style="font-size:17px">Placenta praevia</text><g transform="translate(199 286) scale(0.9)"><path d="M-80 -110 C-120 -80 -124 30 -80 90 C-60 116 -36 124 -20 130 L-16 170 L16 170 L20 130 C36 124 60 116 80 90 C124 30 120 -80 80 -110 C40 -140 -40 -140 -80 -110 Z" fill="#E7A9A1" stroke="#A8574F" stroke-width="3"/><path d="M-68 -98 C-102 -70 -104 26 -68 80 C-50 104 -30 112 -10 116 L10 116 C30 112 50 104 68 80 C104 26 102 -70 68 -98 C34 -124 -34 -124 -68 -98 Z" fill="#F8E3D6"/><path d="M-10 116 L-8 168 M10 116 L8 168" stroke="#A8574F" stroke-width="2"/><path d="M-58 88 C-40 112 40 112 58 88 C40 104 -40 104 -58 88 Z M-56 86 C-40 120 40 120 56 86 L50 98 C30 124 -30 124 -50 98 Z" fill="#8E2A3C"/><path d="M-60 80 C-50 120 50 120 60 80 C50 100 -50 100 -60 80 Z" fill="#B23A4E" stroke="#7E1F2F" stroke-width="2"/><g transform="translate(0 -26) scale(0.9)"><circle cx="0" cy="64" r="30" fill="