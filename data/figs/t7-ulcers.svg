<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="The stomach and duodenum with the two common sites of peptic ulcer: a duodenal ulcer in the first part of the duodenum, anterior wall commonest, about four times commoner, H. pylori in about 90 percent, almost never malignant, pain relieved by food and waking the patient at night; and a gastric ulcer on the lesser curvature, H. pylori about 70 percent or NSAIDs, can be malignant so always biopsied, pain worse after food with weight loss."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="640" rx="18" class="bg"/><text x="24" y="36" class="t">Peptic ulcer: duodenal or gastric?</text><text x="24" y="58" class="s">Site, cause and how food changes the pain</text><g transform="translate(300 300)"><path d="M-60 -150 L-46 -150 L-40 -96 C-20 -120 30 -126 54 -100 C78 -74 76 -20 60 20 C44 60 0 92 -46 96 C-70 98 -90 90 -104 82 L-110 102 C-120 104 -132 100 -134 92 C-150 84 -160 70 -150 58 C-140 50 -126 56 -120 62 C-100 62 -84 60 -72 50 C-60 40 -56 20 -60 0 C-64 -30 -60 -70 -56 -98 Z" fill="#F1B7B0" stroke="#B9665E" stroke-width="2.4"/><path d="M-56 -98 C-60 -60 -64 -20 -60 0 C-56 24 -64 44 -80 54" stroke="#B9665E" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/><path d="M-134 92 C-150 120 -160 160 -146 200 C-136 222 -110 222 -96 200 C-86 186 -90 168 -100 160" fill="none" stroke="#E9B98A" stroke-width="26" stroke-linecap="round"/><path d="M-134 92 C-150 120 -160 160 -146 200 C-136 222 -110 222 -96 200 C-86 186 -90 168 -100 160" fill="none" stroke="#C99A62" stroke-width="1.4"/><ellipse cx="-62" cy="-8" rx="9" ry="7" fill="#7E1F1F" stroke="#F7E3C9" stroke-width="2"/><ellipse cx="-142" cy="104" rx="8" ry="7" fill="#7E1F1F" stroke="#F7E3C9" stroke-width="2"/></g><path d="M180 126L246 168" class="ln" stroke-width="1.2" fill="none"/><circle cx="246" cy="168" r="2.6" class="lnf"/><text x="150" y="120" class="n sm">oesophagus</text><path d="M420 182L336 210" class="ln" stroke-width="1.2" fill="none"/><circle cx="336" cy="210" r="2.6" class="lnf"/><text x="420" y="176" class="n sm" text-anchor="middle">fundus</text><path d="M430 436L360 360" class="ln" stroke-width="1.2" fill="none"/><circle cx="360" cy="360" r="2.6" class="lnf"/><text x="430" y="430" class="n sm" text-anchor="middle">greater curvature</text><path d="M70 268L236 286" class="ln" stroke-width="1.2" fill="none"/><circle cx="236" cy="286" r="2.6" class="lnf"/><text x="40" y="262" class="n sm">lesser curvature</text><path d="M70 346L184 364" class="ln" stroke-width="1.2" fill="none"/><circle cx="184" cy="364" r="2.6" class="lnf"/><text x="40" y="340" class="n sm">pylorus</text><path d="M70 506L162 470" class="ln" stroke-width="1.2" fill="none"/><circle cx="162" cy="470" r="2.6" class="lnf"/><text x="40" y="500" class="n sm">duodenum</text><text x="330" y="300" class="n sm" text-anchor="middle">body</text><circle cx="264" cy="278" r="13" class="fred"/><text x="264" y="283" class="l b red" text-anchor="middle">G</text><circle cx="128" cy="424" r="13" class="fblu"/><text x="128" y="429" class="l b blu" text-anchor="middle">D</text><rect x="488" y="84" width="248" height="196" rx="14" class="fblu"/><circle cx="512" cy="112" r="13" class="fblu"/><text x="512" y="117" class="l b blu" text-anchor="middle">D</text><text x="534" y="117" class="h blu">Duodenal ulcer</text><text x="504" y="144" class="n sm">Commoner (about 4 : 1)</text><text x="504" y="162" class="n sm">1st part of duodenum,</text><text x="504" y="180" class="n sm">anterior wall commonest</text><text x="504" y="198" class="n sm">H. pylori in ~90%; high acid</text><text x="504" y="216" class="n sm">Almost never malignant</text><rect x="488" y="296" width="248" height="162" rx="14" class="fred"/><circle cx="512" cy="324" r="13" class="fred"/><text x="512" y="329" class="l b red" text-anchor="middle">G</text><text x="534" y="329" class="h red">Gastric ulcer</text><text x="504" y="356" class="n sm">Lesser curvature</text><text x="504" y="374" class="n sm">H. pylori ~70%, NSAIDs</text><text x="504" y="392" class="n sm">Biopsy every gastric ulcer:</text><text x="504" y="410" class="n sm">it can be malignant</text><text x="24" y="568" class="n sm b">PAIN AND FOOD</text><rect x="24" y="584" width="404" height="20" rx="10" class="fblu"/><text x="226.0" y="598.5" class="l sm b blu" text-anchor="middle">Duodenal: relieved by food, hunger pain, wakes at night</text><rect x="24" y="612" width="290" height="20" rx="10" class="fred"/><text x="169.0" y="626.5" class="l sm b red" text-anchor="middle">Gastric: worse after food, weight loss</text><text x="470" y="598" class="n sm">"Gastric Gets worse with food;</text><text x="470" y="616" class="n sm">Duodenal is Dulled by food."</text></svg>