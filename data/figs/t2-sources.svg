ate(67.5)"/><ellipse cx="0" cy="-22" rx="5" ry="16" fill="#F6C02B" stroke="#C89310" stroke-width="1.2" transform="rotate(90.0)"/><ellipse cx="0" cy="-22" rx="5" ry="16" fill="#F6C02B" stroke="#C89310" stroke-width="1.2" transform="rotate(112.5)"/><ellipse cx="0" cy="-22" rx="5" ry="16" fill="#F6C02B" stroke="#C89310" stroke-width="1.2" transform="rotate(135.0)"/><ellipse cx="0" cy="-22" rx="5" ry="16" fill="#F6C02B" stroke="#C89310" stroke-width="1.2" transform="rotate(157.5)"/><ellipse cx="0" cy="-22" rx="5" ry="16" fill="#F6C02B" stroke="#C89310" stroke-width="1.2" transform="rotate(180.0)"/><ellipse cx="0" cy="-22" rx="5" ry="16" fill="#F6C02B" stroke="#C89310" stroke-width="1.2" transform="rotate(202.5)"/><ellipse cx="0" cy="-22" rx="5" ry="16" fill="#F6C02B" stroke="#C89310" stroke-width="1.2" transform="rotate(225.0)"/><ellipse cx="0" cy="-22" rx="5" ry="16" fill="#F6C02B" stroke="#C89310" stroke-width="1.2" transform="rotate(247.5)"/><ellipse cx="0" cy="-22" rx="5" ry="16" fill="#F6C02B" stroke="#C89310" stroke-width="1.2" transform="rotate(270.0)"/><ellipse cx="0" cy="-22" rx="5" ry="16" fill="#F6C02B" stroke="#C89310" stroke-width="1.2" transform="rotate(292.5)"/><ellipse cx="0" cy="-22" rx="5" ry="16" fill="#F6C02B" stroke="#C89310" stroke-width="1.2" transform="rotate(315.0)"/><ellipse cx="0" cy="-22" rx="5" ry="16" fill="#F6C02B" stroke="#C89310" stroke-width="1.2" transform="rotate(337.5)"/><circle r="11" fill="#D9771E"/></g></g><text x="398" y="224" class="l b grn" style="font-size:16px">Arnica</text><text x="398" y="244" class="n sm" textLength="146" lengthAdjust="spacingAndGlyphs">leopard's bane · Compositae</text><text x="398" y="266" class="l sm">Bruised soreness; says</text><text x="398" y="282" class="l sm">he is well when very ill</text><rect x="567" y="76" width="169" height="226" rx="14" class="fgrn"/><g transform="translate(651 150) scale(1.1)"><path d="M0 50 L0 0" stroke="#7A4A2A" stroke-width="3"/><path d="M0 0 C10 -14 30 -16 44 0 C30 16 10