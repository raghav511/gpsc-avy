 388) scale(1.1)"><g transform="translate(-24 6)"><circle r="17" fill="#B9B2A3" stroke="#7E7666" stroke-width="1.4"/><circle r="11" fill="none" stroke="#9A9282" stroke-width="1" stroke-dasharray="2 2"/><circle r="2.5" fill="#7E7666"/></g><g transform="translate(16 -10)"><circle r="17" fill="#B9B2A3" stroke="#7E7666" stroke-width="1.4"/><circle r="11" fill="none" stroke="#9A9282" stroke-width="1" stroke-dasharray="2 2"/><circle r="2.5" fill="#7E7666"/></g><g transform="translate(22 22)"><circle r="17" fill="#B9B2A3" stroke="#7E7666" stroke-width="1.4"/><circle r="11" fill="none" stroke="#9A9282" stroke-width="1" stroke-dasharray="2 2"/><circle r="2.5" fill="#7E7666"/></g></g><text x="217" y="462" class="l b grn" style="font-size:16px">Nux vomica</text><text x="217" y="482" class="n sm" textLength="146" lengthAdjust="spacingAndGlyphs">poison nut (seeds) · Loganiaceae</text><text x="217" y="504" class="l sm">Irritable, chilly; urging</text><text x="217" y="520" class="l sm">without result</text><rect x="386" y="314" width="169" height="226" rx="14" class="fpur"/><g transform="translate(470 388) scale(1.1)"><ellipse cx="-12" cy="-22" rx="22" ry="12" fill="#DDEEF8" stroke="#8FB3C9" stroke-width="1.2" transform="rotate(-20 -12 -22)"/><ellipse cx="10" cy="-24" rx="20" ry="11" fill="#DDEEF8" stroke="#8FB3C9" stroke-width="1.2" transform="rotate(20 10 -24)"/><ellipse cx="14" cy="4" rx="26" ry="16" fill="#F2B632" stroke="#5A3A12" stroke-width="1.4"/><path d="M8 -10 C12 -2 12 10 8 18" stroke="#3A2A12" stroke-width="4" fill="none"/><path d="M17 -10 C21 -2 21 10 17 18" stroke="#3A2A12" stroke-width="4" fill="none"/><path d="M26 -10 C30 -2 30 10 26 18" stroke="#3A2A12" stroke-width="4" fill="none"/><circle cx="-18" cy="2" r="12" fill="#5A3A12"/><circle cx="-34" cy="0" r="8" fill="#3A2A12"/><path d="M40 4 l10 0" stroke="#3A2A12" stroke-width="2"/></g><text x="398" y="462" class="l b pur" style="font-size:16px">Apis</text><text x="398" y="482" class="n sm">honey bee</text><text x="398" y="504" class="l sm">Oedema, stinging pains,</text><text x="398" y="520" class="l sm">thirstless</text><rect x="567" y="314" width="169" height="226" rx="14" class="fpur"/><g transform="translate(651 388) scale(1.1)"><path d="M-40 30 C-60 10 -30 -6 0 6 C30 18 50 4 40 -14" stroke="#B88C4A" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M-40 28 l6 -6 l6 6 l-6 6 z" fill="#5E3A1E"/><path d="M-26 20 l6 -6 l6 6 l-6 6 z" fill="#5E3A1E"/><path d="M-12 12 l6 -6 l6 6 l-6 6 z" fill="#5E3A1E"/><path d="M2 28 l6 -6 l6 6 l-6 6 z" fill="#5E3A1E"/><path d="M16 20 l6 -6 l6 6 l-6 6 z" fill="#5E3A1E"/><path d="M30 12 l6 -6 l6 6 l-6 6 z" fill="#5E3A1E"/><path d="M30 -22 C40 -40 66 -40 70 -24 C72 -12 56 -6 40 -8 Z" fill="#B88C4A" stroke="#5E3A1E" stroke-width="1.4"/><circle cx="56" cy="-26" r="3" fill="#1B1520"/><path d="M64 -14 l-2 10 M58 -12 l-2 9" stroke="#F4F2EC" stroke-width="2.4" stroke-linecap="round"/></g><text x="579" y="462" class="l b pur" style="font-size:16px">Lachesis</text><text x="579" y="482" class="n sm">snake venom</text><text x="579" y="504" class="l sm">Worse after sleep</text><rect x="24" y="552" width="169" height="226" rx="14" class="fpur"/><g transform="translate(108 626) scale(1.1)"><path d="M-6 -36 C10 -36 14 -10 12 20 C10 40 -10 40 -12 20 C-14 -10 -10 -36 -6 -36 Z" fill="#2E9E6E" stroke="#13603F" stroke-width="1.6"/><path d="M-1 -30 L0 38" stroke="#13603F" stroke-width="1.4"/><ellipse cx="-1" cy="-44" rx="8" ry="7" fill="#1E7A52"/><path d="M-10 -20 l-14 -8" stroke="#13603F" stroke-width="2"/><path d="M-10 0 l-14 0" stroke="#13603F" stroke-width="2"/><path d="M-10 18 l-14 8" stroke="#13603F" stroke-width="2"/><path d="M8 -20 l14 -8" stroke="#13603F" stroke-width="2"/><path d="M8 0 l14 0" stroke="#13603F" stroke-width="2"/><path d="M8 18 l14 8" stroke="#13603F" stroke-width="2"/><path d="M-4 -50 l-10 -14 M2 -50 l10 -14" stroke="#13603F" stroke-width="1.6"/></g><text x="36" y="700" class="l b pur" style="font-size:16px">Cantharis</text><text x="36" y="720" class="n sm">Spanish fly, a beetle</text><text x="36" y="742" class="l sm">Burning cystitis;</text><text x="36" y="758" class="l sm">burns and scalds</text><rect x="205" y="552" width="169" height="226" rx="14" class="fpur"/><g transform="translate(289 626) scale(1.1)"><path d="M20 10 C30 30 10 50 -10 44 C-40 40 -50 20 -40 4 C-30 -10 0 -20 20 10 Z" fill="#2B2B3A" opacity=".35"/><path d="M-36 -10 C-36 -34 30 -40 44 -20 C54 -6 44 8 30 6 C10 4 -36 10 -36 -10 Z" fill="#C9A6C9" stroke="#7E5A7E" stroke-width="1.4"/><path d="M-34 -8 C-48 -4 -54 0 -60 4" stroke="#7E5A7E" stroke-width="2" fill="none"/><path d="M-34 -4 C-48 2 -54 8 -60 12" stroke="#7E5A7E" stroke-width="2" fill="none"/><path d="M-34 0 C-48 8 -54 16 -60 20" stroke="#7E5A7E" stroke-width="2" fill="none"/><path d="M-34 4 C-48 14 -54 24 -60 28" stroke="#7E5A7E" stroke-width="2" fill="none"/><circle cx="-24" cy="-14" r="3" fill="#1B1520"/></g><text x="217" y="700" class="l b pur" style="font-size:16px">Sepia</text><text x="217" y="720" class="n sm">cuttlefish ink</text><text x="217" y="742" class="l sm">Complements Nat mur</text><rect x="386" y="552" width="169" height="226" rx="14" class="fpur"/><g transform="translate(470 626) scale(1.1)"><path d="M-40 10 C-50 -14 -30 -40 -6 -36 C10 -46 40 -36 42 -14 C56 4 42 34 18 34 C0 44 -30 38 -40 10 Z" fill="#D9A94E" stroke="#9E7524" stroke-width="1.6"/><ellipse cx="-20" cy="-14" rx="5" ry="4.0" fill="#9E7524" opacity=".55"/><ellipse cx="4" cy="-20" rx="4" ry="3.2" fill="#9E7524" opacity=".55"/><ellipse cx="24" cy="-8" rx="5" ry="4.0" fill="#9E7524" opacity=".55"/><ellipse cx="-10" cy="6" rx="4" ry="3.2" fill="#9E7524" opacity=".55"/><ellipse cx="12" cy="14" rx="6" ry="4.8" fill="#9E7524" opacity=".55"/><ellipse cx="-28" cy="18" rx="3" ry="2.4" fill="#9E7524" opacity=".55"/><ellipse cx="30" cy="18" rx="3" ry="2.4" fill="#9E7524" opacity=".55"/></g><text x="398" y="700" class="l b pur" style="font-size:16px">Spongia</text><text x="398" y="720" class="n sm">roasted sponge</text><text x="398" y="742" class="l sm">Dry, sawing croup cough</text><text x="398" y="758" class="l sm">like a saw through pine</text><rect x="567" y="552" width="169" height="226" rx="14" class="famb"/><g transform="translate(651 626) scale(1.1)"><rect x="-12" y="-44" width="24" height="84" rx="10" fill="url(#glass)" stroke="#8FB3C9" stroke-width="1.6"/><rect x="-10" y="-4" width="20" height="42" rx="8" fill="#E9DFA6"/><circle cx="-4" cy="6" r="2" fill="#B9A25A"/><circle cx="0" cy="12" r="2" fill="#B9A25A"/><circle cx="4" cy="18" r="2" fill="#B9A25A"/><circle cx="-4" cy="24" r="2" fill="#B9A25A"/><circle cx="0" cy="30" r="2" fill="#B9A25A"/><rect x="-14" y="-50" width="28" height="10" rx="3" fill="#C9D1D9"/></g><text x="579" y="700" class="l b amb" style="font-size:16px">Nosodes</text><text x="579" y="720" class="n sm">disease products</text><text x="579" y="742" class="l sm">Psorinum, Medorrhinum,</text><text x="579" y="758" class="l sm">Pyrogenium, Bacillinum</text><text x="24" y="802" class="n sm">Trap: Apis, Cantharis and Spongia are ANIMAL remedies even when listed with the minerals (purple tiles).</text></svg>