<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" role="img" aria-label="Airways in cross-section: a normal airway with an open lumen; asthma with squeezing smooth muscle, a swollen wall, a mucus plug and eosinophils; chronic bronchitis with enlarged mucus glands and goblet cells (Reid index over 0.4). Below, normal alveoli as many small sacs versus emphysema with destroyed walls and enlarged airspaces. Asthma is variable and reversible; COPD is persistent with post-bronchodilator FEV1/FVC below 0.7."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="700" rx="18" class="bg"/><text x="24" y="36" class="t">Asthma and COPD in the airway</text><text x="24" y="58" class="s">What narrows the airway, and what destroys the alveoli</text><rect x="24" y="76" width="228" height="288" rx="14" class="pn"/><g transform="translate(138 162)"><circle r="62" fill="#F3C9C2" stroke="#C7867D" stroke-width="2"/><circle r="50" fill="#E7A39A"/><circle r="40" fill="#FFF8F0" stroke="#D49A90" stroke-width="2"/></g><text x="40" y="262" class="l b grn">Normal airway</text><text x="40" y="284" class="n sm">Open lumen, thin wall</text><rect x="264" y="76" width="228" height="288" rx="14" class="pn"/><g transform="translate(378 162)"><circle r="66" fill="#F0B4AA" stroke="#C7867D" stroke-width="2"/><path d="M58 0A58 58 0 0 1 54 20" stroke="#B5453C" stroke-width="10" fill="none"/><path d="M50 29A58 58 0 0 1 37 44" stroke="#B5453C" stroke-width="10" fill="none"/><path d="M29 50A58 58 0 0 1 10 57" stroke="#B5453C" stroke-width="10" fill="none"/><path d="M1 58A58 58 0 0 1 -19 55" stroke="#B5453C" stroke-width="10" fill="none"/><path d="M-28 51A58 58 0 0 1 -44 38" stroke="#B5453C" stroke-width="10" fill="none"/><path d="M-50 30A58 58 0 0 1 -57 11" stroke="#B5453C" stroke-width="10" fill="none"/><path d="M-58 1A58 58 0 0 1 -55 -19" stroke="#B5453C" stroke-width="10" fill="none"/><path d="M-51 -28A58 58 0 0 1 -38 -44" stroke="#B5453C" stroke-width="10" fill="none"/><path d="M-30 -49A58 58 0 0 1 -12 -57" stroke="#B5453C" stroke-width="10" fill="none"/><path d="M-2 -58A58 58 0 0 1 18 -55" stroke="#B5453C" stroke-width="10" fill="none"/><path d="M27 -51A58 58 0 0 1 43 -39" stroke="#B5453C" stroke-width="10" fill="none"/><path d="M49 -31A58 58 0 0 1 57 -12" stroke="#B5453C" stroke-width="10" fill="none"/><path d="M-26 -8 C-30 -26 -12 -34 0 -22 C12 -36 34 -24 26 -6 C40 6 24 26 8 18 C0 32 -24 30 -22 14 C-36 8 -38 -2 -26 -8 Z" fill="#FFF8F0" stroke="#D49A90" stroke-width="2"/><path d="M-10 -6 C-4 -14 8 -12 10 -2 C12 8 -2 12 -8 6 Z" fill="#E9DFA6" stroke="#C9B85A"/><circle cx="40" cy="0" r="3" fill="#E2643F"/><circle cx="25" cy="31" r="3" fill="#E2643F"/><circle cx="-9" cy="39" r="3" fill="#E2643F"/><circle cx="-36" cy="17" r="3" fill="#E2643F"/><circle cx="-36" cy="-18" r="3" fill="#E2643F"/><circle cx="-8" cy="-39" r="3" fill="#E2643F"/><circle cx="25" cy="-31" r="3" fill="#E2643F"/></g><text x="280" y="262" class="l b blu">Asthma</text><text x="280" y="284" class="n sm">Smooth muscle squeezes,</text><text x="280" y="300" class="n sm">wall swells, mucus plug;</text><text x="280" y="316" class="n sm">eosinophils, mast cells</text><rect x="504" y="76" width="228" height="288" rx="14" class="pn"/><g transform="translate(618 162)"><circle r="64" fill="#F3C9C2" stroke="#C7867D" stroke-width="2"/><circle r="52" fill="#E7A39A"/><ellipse cx="50" cy="0" rx="9" ry="7" fill="#EFE7C9" stroke="#C9B85A"/><ellipse cx="38" cy="32" rx="9" ry="7" fill="#EFE7C9" stroke="#C9B85A"/><ellipse cx="8" cy="49" rx="9" ry="7" fill="#EFE7C9" stroke="#C9B85A"/><ellipse cx="-25" cy="43" rx="9" ry="7" fill="#EFE7C9" stroke="#C9B85A"/><ellipse cx="-47" cy="17" rx="9" ry="7" fill="#EFE7C9" stroke="#C9B85A"/><ellipse cx="-47" cy="-18" rx="9" ry="7" fill="#EFE7C9" stroke="#C9B85A"/><ellipse cx="-25" cy="-44" rx="9" ry="7" fill="#EFE7C9" stroke="#C9B85A"/><ellipse cx="9" cy="-49" rx="9" ry="7" fill="#EFE7C9" stroke="#C9B85A"/><ellipse cx="39" cy="-32" rx="9" ry="7" fill="#EFE7C9" stroke="#C9B85A"/><circle r="34" fill="#FFF8F0" stroke="#D49A90" stroke-width="2"/><path d="M-26 6 C-14 -10 10 -14 26 2 C18 18 -14 24 -26 6 Z" fill="#E9DFA6" opacity=".9"/></g><text x="520" y="262" class="l b amb">Chronic bronchitis</text><text x="520" y="284" class="n sm">Enlarged mucus glands,</text><text x="520" y="300" class="n sm">goblet cells (Reid index</text><text x="520" y="316" class="n sm">&gt; 0.4); "blue bloater"</text><rect x="24" y="380" width="348" height="220" rx="14" class="pn"/><rect x="388" y="380" width="348" height="220" rx="14" class="pn"/><g transform="translate(120 480)"><circle cx="-22" cy="-26" r="16" fill="#FFF8F0" stroke="#D49A90" stroke-width="2.4"/><circle cx="-30" cy="0" r="16" fill="#FFF8F0" stroke="#D49A90" stroke-width="2.4"/><circle cx="-22" cy="26" r="16" fill="#FFF8F0" stroke="#D49A90" stroke-width="2.4"/><circle cx="8" cy="-26" r="16" fill="#FFF8F0" stroke="#D49A90" stroke-width="2.4"/><circle cx="0" cy="0" r="16" fill="#FFF8F0" stroke="#D49A90" stroke-width="2.4"/><circle cx="8" cy="26" r="16" fill="#FFF8F0" stroke="#D49A90" stroke-width="2.4"/><circle cx="38" cy="-26" r="16" fill="#FFF8F0" stroke="#D49A90" stroke-width="2.4"/><circle cx="30" cy="0" r="16" fill="#FFF8F0" stroke="#D49A90" stroke-width="2.4"/><circle cx="38" cy="26" r="16" fill="#FFF8F0" stroke="#D49A90" stroke-width="2.4"/></g><g transform="translate(484 480)"><path d="M-52 -40 C-30 -60 20 -56 46 -36 C62 -10 56 30 30 46 C0 60 -40 52 -54 26 C-64 0 -62 -24 -52 -40 Z" fill="#FFF8F0" stroke="#D49A90" stroke-width="2.4"/><path d="M-20 -50 L-14 -20 M18 48 L12 20 M-56 6 L-30 2" stroke="#D49A90" stroke-width="2.4"/></g><text x="196" y="450" class="l b grn">Normal alveoli</text><text x="196" y="472" class="n sm">Many small sacs,</text><text x="196" y="488" class="n sm">large surface for</text><text x="196" y="504" class="n sm">gas exchange</text><text x="560" y="450" class="l b red">Emphysema</text><text x="560" y="472" class="n sm">Walls destroyed,</text><text x="560" y="488" class="n sm">airspaces enlarged;</text><text x="560" y="504" class="n sm">"pink puffer"</text><text x="404" y="566" class="n sm">Centriacinar: smokers, upper lobes</text><text x="404" y="582" class="n sm">Panacinar: α-1 antitrypsin, lower lobes</text><text x="24" y="632" class="l sm blu">Asthma: variable and REVERSIBLE (FEV1 rises ≥ 12% and ≥ 200 mL after a bronchodilator).</text><text x="24" y="656" class="l sm red" textLength="712" lengthAdjust="spacingAndGlyphs">COPD: persistent, not fully reversible (post-bronchodilator FEV1/FVC &lt; 0.70); smoking is the commonest cause.</text></svg>