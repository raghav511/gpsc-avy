<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="Gas exchange between an alveolus and a pulmonary capillary: alveolar PO2 104 and PCO2 40 mmHg; venous blood arrives with PO2 40 and PCO2 45 to 46 and leaves as arterial blood with PO2 95 to 100 and PCO2 40; oxygen diffuses into the blood and carbon dioxide out, about 20 times faster; type II cells secrete surfactant; oxygen travels 97 to 98 percent on haemoglobin, carbon dioxide 70 percent as bicarbonate."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="560" rx="18" class="bg"/><text x="24" y="36" class="t">Gas exchange in the lung</text><text x="24" y="58" class="s">Partial pressures across one alveolus and its capillary (mmHg)</text><circle cx="380" cy="236" r="116" fill="#EAF3FB" stroke="#9DB7D2" stroke-width="10"/><path d="M380 122 L380 74" stroke="#9DB7D2" stroke-width="40"/><path d="M380 128 L380 74" stroke="#EAF3FB" stroke-width="22"/><text x="424" y="96" class="n sm">air in</text><ellipse cx="300" cy="158" rx="18" ry="11" fill="#C6A3D9" stroke="#8D62A8" stroke-width="1.4"/><circle cx="300" cy="158" r="4" fill="#5E3D78"/><circle cx="292" cy="140" r="2.4" fill="#C6A3D9"/><circle cx="298" cy="136" r="2.4" fill="#C6A3D9"/><circle cx="304" cy="140" r="2.4" fill="#C6A3D9"/><circle cx="310" cy="136" r="2.4" fill="#C6A3D9"/><text x="380" y="206" class="n sm b" text-anchor="middle" style="fill:#4A5266">ALVEOLUS</text><text x="380" y="232" text-anchor="middle" style="font:700 15px system-ui,sans-serif;fill:#1E2330">PO₂ <tspan style="fill:#2E68D8">104</tspan> · PCO₂ <tspan style="fill:#D33A3F">40</tspan></text><text x="380" y="250" class="n sm" text-anchor="middle" style="fill:#4A5266">mmHg</text><linearGradient id="cap" x1="0" x2="1"><stop offset="0" stop-color="#6E8FC9"/><stop offset=".55" stop-color="#B05A8C"/><stop offset="1" stop-color="#D9534C"/></linearGradient><path d="M40 374 C200 374 250 352 380 352 C510 352 560 374 720 374 L720 430 C560 430 510 408 380 408 C250 408 200 430 40 430 Z" fill="url(#cap)" opacity=".9"/><ellipse cx="120" cy="400" rx="20" ry="10" fill="url(#rbc)" stroke="#9E2B24" stroke-width="1"/><ellipse cx="250" cy="392" rx="20" ry="10" fill="url(#rbc)" stroke="#9E2B24" stroke-width="1"/><ellipse cx="380" cy="400" rx="20" ry="10" fill="url(#rbc)" stroke="#9E2B24" stroke-width="1"/><ellipse cx="510" cy="392" rx="20" ry="10" fill="url(#rbc)" stroke="#9E2B24" stroke-width="1"/><ellipse cx="640" cy="400" rx="20" ry="10" fill="url(#rbc)" stroke="#9E2B24" stroke-width="1"/><path d="M56 456L140 456" class="sblu" stroke-width="2.4" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><path d="M620 456L704 456" class="sred" stroke-width="2.4" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><text x="40" y="484" class="l sm b blu">from the body (venous)</text><text x="40" y="502" class="n sm">PO₂ 40 · PCO₂ 45–46</text><text x="720" y="484" class="l sm b red" text-anchor="end">to the body (arterial)</text><text x="720" y="502" class="n sm" text-anchor="end">PO₂ 95–100 · PCO₂ 40</text><path d="M330 290L330 360" class="sblu" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><text x="318" y="320" class="l b blu" text-anchor="end">O₂</text><path d="M430 360L430 290" class="sred" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><text x="442" y="320" class="l b red">CO₂</text><text x="442" y="338" class="n sm">20× faster</text><rect x="24" y="84" width="200" height="150" rx="14" class="pn"/><text x="38" y="110" class="l b pur">Type II cells</text><text x="38" y="130" class="n sm">secrete surfactant</text><text x="38" y="146" class="n sm">(from ~24 weeks of</text><text x="38" y="162" class="n sm">gestation): keeps small</text><text x="38" y="178" class="n sm">alveoli open</text><path d="M224 150L284 156" class="ln" stroke-width="1.2" fill="none"/><circle cx="284" cy="156" r="2.6" class="lnf"/><rect x="536" y="84" width="200" height="150" rx="14" class="pn"/><text x="550" y="110" class="l b blu">How O₂ travels</text><text x="550" y="130" class="n sm">97–98% on haemoglobin</text><text x="550" y="146" class="n sm">1.5–3% dissolved</text><text x="550" y="162" class="n sm">1 g Hb carries 1.34 mL</text><text x="550" y="178" class="n sm">P50 about 27 mmHg</text><rect x="536" y="248" width="200" height="92" rx="14" class="pn"/><text x="550" y="272" class="l b red">How CO₂ travels</text><text x="550" y="292" class="n sm">70% bicarbonate</text><text x="550" y="308" class="n sm">23% carbamino, 7% dissolved</text><text x="24" y="540" class="n sm">The thin alveolar wall and capillary wall together form the respiratory membrane.</text></svg>