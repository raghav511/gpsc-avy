<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="Biomedical waste colour codes under the 2016 rules: yellow bag for anatomical waste, soiled dressings, expired medicines, chemical waste and cultures (incineration or deep burial); red bag for contaminated recyclable plastics such as tubing, bottles, IV sets, catheters, needle-free syringes and gloves (autoclave, shred, recycle); white puncture-proof translucent container for sharps (autoclave, shred, sharps pit); blue cardboard box for glassware and metal implants (disinfect, recycle)."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="640" rx="18" class="bg"/><text x="24" y="36" class="t">Biomedical waste: which colour?</text><text x="24" y="58" class="s">Segregate at the source, by colour</text><rect x="24" y="76" width="170" height="520" rx="14" class="pn"/><g transform="translate(109 170) scale(1.1)"><path d="M-46 -40 C-50 -20 -54 30 -48 58 C-30 66 30 66 48 58 C54 30 50 -20 46 -40 Z" fill="#F2C230" stroke="#B88B00" stroke-width="2"/><path d="M-46 -40 C-30 -48 -14 -44 -10 -54 C-4 -60 4 -60 10 -54 C14 -44 30 -48 46 -40" fill="#F2C230" stroke="#B88B00" stroke-width="2"/><path d="M-10 -54 C-6 -64 6 -64 10 -54" fill="none" stroke="#B88B00" stroke-width="3"/><g transform="translate(0 10)"><g transform="scale(.9)" fill="none" stroke="#1E2330" stroke-width="3.2"><circle cx="0" cy="-7" r="8"/><circle cx="-7" cy="5" r="8"/><circle cx="7" cy="5" r="8"/><circle r="3" fill="#1E2330"/></g></g></g><text x="38" y="268" class="h xl amb">Yellow</text><text x="38" y="288" class="n sm">bag</text><text x="38" y="320" class="n sm b">WHAT GOES IN</text><text x="38" y="340" class="l sm">Anatomical waste</text><text x="38" y="358" class="l sm">Soiled dressings,</text><text x="38" y="376" class="l sm">cotton</text><text x="38" y="394" class="l sm">Expired medicines</text><text x="38" y="412" class="l sm">Chemical waste</text><text x="38" y="430" class="l sm">Microbiology</text><text x="38" y="448" class="l sm">cultures</text><text x="38" y="492" class="n sm b">TREATMENT</text><text x="38" y="512" class="n sm">Incineration or</text><text x="38" y="529" class="n sm">deep burial</text><rect x="204" y="76" width="170" height="520" rx="14" class="pn"/><g transform="translate(289 170) scale(1.1)"><path d="M-46 -40 C-50 -20 -54 30 -48 58 C-30 66 30 66 48 58 C54 30 50 -20 46 -40 Z" fill="#D9443E" stroke="#9E2420" stroke-width="2"/><path d="M-46 -40 C-30 -48 -14 -44 -10 -54 C-4 -60 4 -60 10 -54 C14 -44 30 -48 46 -40" fill="#D9443E" stroke="#9E2420" stroke-width="2"/><path d="M-10 -54 C-6 -64 6 -64 10 -54" fill="none" stroke="#9E2420" stroke-width="3"/><g transform="translate(0 10)"><g transform="scale(.9)" fill="none" stroke="#FFFFFF" stroke-width="3.2"><circle cx="0" cy="-7" r="8"/><circle cx="-7" cy="5" r="8"/><circle cx="7" cy="5" r="8"/><circle r="3" fill="#FFFFFF"/></g></g></g><text x="218" y="268" class="h xl red">Red</text><text x="218" y="288" class="n sm">bag</text><text x="218" y="320" class="n sm b">WHAT GOES IN</text><text x="218" y="340" class="l sm">Recyclable plastics:</text><text x="218" y="358" class="l sm">tubing, bottles,</text><text x="218" y="376" class="l sm">IV sets, catheters,</text><text x="218" y="394" class="l sm">gloves, syringes</text><text x="218" y="412" class="l sm">WITHOUT needles</text><text x="218" y="492" class="n sm b">TREATMENT</text><text x="218" y="512" class="n sm">Autoclave or</text><text x="218" y="529" class="n sm">microwave, shred,</text><text x="218" y="546" class="n sm">recycle</text><rect x="384" y="76" width="170" height="520" rx="14" class="pn"/><g transform="translate(469 170) scale(1.1)"><rect x="-36" y="-44" width="72" height="104" rx="8" fill="#F4F6F8" stroke="#9AA6B2" stroke-width="2" opacity=".95"/><rect x="-40" y="-56" width="80" height="16" rx="5" fill="#E2E7EC" stroke="#9AA6B2" stroke-width="2"/><rect x="-12" y="-62" width="24" height="8" rx="2" fill="#C9D1D9"/><path d="M-20 -30 L18 40 M-8 -34 L24 30" stroke="#8E95A6" stroke-width="1.8" opacity=".5"/><g transform="translate(0 10)"><g transform="scale(.9)" fill="none" stroke="#D33A3F" stroke-width="3.2"><circle cx="0" cy="-7" r="8"/><circle cx="-7" cy="5" r="8"/><circle cx="7" cy="5" r="8"/><circle r="3" fill="#D33A3F"/></g></g></g><text x="398" y="268" class="h xl ink">White</text><text x="398" y="288" class="n sm" textLength="146" lengthAdjust="spacingAndGlyphs">puncture-proof, translucent</text><text x="398" y="320" class="n sm b">WHAT GOES IN</text><text x="398" y="340" class="l sm">Sharps: needles,</text><text x="398" y="358" class="l sm">syringes with fixed</text><text x="398" y="376" class="l sm">needles, scalpels,</text><text x="398" y="394" class="l sm">blades</text><text x="398" y="492" class="n sm b">TREATMENT</text><text x="398" y="512" class="n sm">Autoclave, shred,</text><text x="398" y="529" class="n sm">sharps pit or</text><text x="398" y="546" class="n sm">encapsulation</text><rect x="564" y="76" width="170" height="520" rx="14" class="pn"/><g transform="translate(649 170) scale(1.1)"><path d="M-48 -34 L48 -34 L48 58 L-48 58 Z" fill="#2E68D8" stroke="#1E4A9E" stroke-width="2"/><path d="M-48 -34 L-34 -50 L62 -50 L48 -34 Z" fill="#4B82E8" stroke="#1E4A9E" stroke-width="2"/><path d="M48 -34 L62 -50 L62 42 L48 58 Z" fill="#2457B8" stroke="#1E4A9E" stroke-width="2"/><path d="M-6 -26 h12 v10 c10 4 14 12 14 22 v38 h-40 v-38 c0 -10 4 -18 14 -22z" fill="#D9ECF8" opacity=".9"/><path d="M-16 12 l8 6 l-4 8 l10 4 l-2 12" stroke="#1E4A9E" stroke-width="1.6" fill="none"/></g><text x="578" y="268" class="h xl blu">Blue</text><text x="578" y="288" class="n sm">cardboard box</text><text x="578" y="320" class="n sm b">WHAT GOES IN</text><text x="578" y="340" class="l sm">Glassware (broken</text><text x="578" y="358" class="l sm">or discarded)</text><text x="578" y="376" class="l sm">Metal body implants</text><text x="578" y="492" class="n sm b">TREATMENT</text><text x="578" y="512" class="n sm">Disinfect or</text><text x="578" y="529" class="n sm">autoclave, then</text><text x="578" y="546" class="n sm">recycle</text><text x="24" y="622" class="n sm" textLength="712" lengthAdjust="spacingAndGlyphs">Bio-Medical Waste Management Rules, 2016 · treat within 48 hours · hook: Yellow body, Red plastic, White sharps, Blue glass</text></svg>