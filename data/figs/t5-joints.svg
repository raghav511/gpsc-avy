<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-label="The seven kinds of synovial joint drawn as bone ends: plane (intercarpal), hinge (elbow, interphalangeal, ankle), pivot (superior radio-ulnar, atlanto-axial), condylar (knee, temporomandibular), ellipsoid (wrist, metacarpophalangeal), saddle (first carpometacarpal of the thumb) and ball and socket (shoulder, hip), with the non-synovial fibrous and cartilaginous joints listed."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="580" rx="18" class="bg"/><text x="24" y="36" class="t">Synovial joints by shape</text><text x="24" y="58" class="s">The shape of the bone ends decides the movement</text><rect x="24" y="76" width="169" height="224" rx="14" class="pn"/><g transform="translate(108 168)"><rect x="-40" y="-36" width="80" height="32" rx="6" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><rect x="-40" y="4" width="80" height="32" rx="6" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><path d="M-52 0 h104" class="sblu" stroke-width="2.4" marker-end="url(#ah)" marker-start="url(#ah)"/></g><text x="38" y="256" class="l b blu">Plane</text><text x="38" y="274" class="n sm">Intercarpal,</text><text x="38" y="289" class="n sm">acromioclavicular</text><rect x="205" y="76" width="169" height="224" rx="14" class="pn"/><g transform="translate(289 168)"><path d="M-14 -60 L14 -60 L14 -14 C14 4 -14 4 -14 -14 Z" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><path d="M-26 6 C-26 -16 26 -16 26 6 L14 50 L-14 50 Z" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><path d="M40 -10 A40 40 0 0 1 40 40" class="sblu" stroke-width="2.4" fill="none" marker-end="url(#ah)"/></g><text x="219" y="256" class="l b blu">Hinge</text><text x="219" y="274" class="n sm">Elbow, ankle,</text><text x="219" y="289" class="n sm">interphalangeal</text><rect x="386" y="76" width="169" height="224" rx="14" class="pn"/><g transform="translate(470 168)"><rect x="-10" y="-50" width="20" height="100" rx="10" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><path d="M-28 -18 C-28 -34 28 -34 28 -18 L28 18 C28 34 -28 34 -28 18 Z" fill="none" stroke="#8A7150" stroke-width="7"/><ellipse cx="0" cy="-58" rx="28" ry="8" class="sblu" stroke-width="2.4" fill="none" marker-end="url(#ah)"/></g><text x="400" y="256" class="l b blu">Pivot</text><text x="400" y="274" class="n sm">Superior radio-ulnar;</text><text x="400" y="289" class="n sm">atlanto-axial</text><rect x="567" y="76" width="169" height="224" rx="14" class="pn"/><g transform="translate(651 168)"><path d="M-40 -60 L40 -60 L40 -18 C40 4 18 4 10 -10 C4 -2 -4 -2 -10 -10 C-18 4 -40 4 -40 -18 Z" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><path d="M-42 12 C-30 4 -16 6 -8 10 C0 6 8 6 8 10 C16 6 30 4 42 12 L36 54 L-36 54 Z" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/></g><text x="581" y="256" class="l b blu">Condylar</text><text x="581" y="274" class="n sm">Knee,</text><text x="581" y="289" class="n sm">temporomandibular</text><rect x="24" y="312" width="169" height="224" rx="14" class="pn"/><g transform="translate(108 404)"><ellipse cx="0" cy="-16" rx="40" ry="20" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><path d="M-48 10 C-30 -4 30 -4 48 10 L40 54 L-40 54 Z" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><path d="M-58 -16 h116" class="sblu" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M0 -50 v-0" /></g><text x="38" y="492" class="l b blu">Ellipsoid</text><text x="38" y="510" class="n sm">Wrist (radiocarpal),</text><text x="38" y="525" class="n sm">MCP joints</text><rect x="205" y="312" width="169" height="224" rx="14" class="pn"/><g transform="translate(289 404)"><path d="M-40 -8 C-20 -30 20 -30 40 -8 L34 -56 L-34 -56 Z" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><path d="M-40 8 C-20 -12 20 -12 40 8 L34 54 L-34 54 Z" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><path d="M-56 30 C-40 40 40 40 56 30" class="sblu" stroke-width="2" fill="none" marker-end="url(#ah)"/></g><text x="219" y="492" class="l b blu">Saddle</text><text x="219" y="510" class="n sm">1st carpometacarpal</text><text x="219" y="525" class="n sm">(thumb)</text><rect x="386" y="312" width="169" height="224" rx="14" class="pn"/><g transform="translate(470 404)"><path d="M-46 -10 C-46 40 46 40 46 -10 L36 -10 C36 26 -36 26 -36 -10 Z" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><circle cx="0" cy="-12" r="30" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><path d="M-8 -40 L-8 -70 L8 -70 L8 -40" fill="url(#bone)" stroke="#8A7150" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="0" cy="-12" rx="50" ry="14" class="sblu" stroke-width="2" fill="none" marker-end="url(#ah)"/></g><text x="400" y="492" class="l b blu">Ball and socket</text><text x="400" y="510" class="n sm">Shoulder, hip</text><rect x="567" y="312" width="169" height="224" rx="14" class="pn2"/><text x="581" y="342" class="l b">Not synovial</text><text x="581" y="366" class="n sm">Fibrous: sutures,</text><text x="581" y="382" class="n sm">syndesmosis, gomphosis</text><text x="581" y="398" class="n sm">(tooth in socket)</text><text x="581" y="414" class="n sm"></text><text x="581" y="430" class="n sm">Primary cartilaginous:</text><text x="581" y="446" class="n sm">epiphyseal plate</text><text x="581" y="462" class="n sm"></text><text x="581" y="478" class="n sm">Secondary: pubic</text><text x="581" y="494" class="n sm">symphysis, discs</text><text x="24" y="566" class="n sm">Hook: "Saddle for the thumb, ball for the limb roots." Blue arrows show the movement each shape allows.</text></svg>