<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" width="760" height="820" role="img" aria-label="Thrombosis and its consequences: Virchow&#x27;s triad of endothelial injury (most important), stasis or turbulent flow and hypercoagulability, around a vein with a thrombus at a valve pocket showing lines of Zahn; a clot from the deep leg veins travelling to the lungs as a pulmonary embolus (over 95 percent come from there); and wedge-shaped infarcts with the apex at the block, pale in solid organs with end-arteries such as the kidney and red in the lung."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="820" rx="18" class="bg"/><text x="24" y="36" class="t">Thrombosis, embolism and infarction</text><text x="24" y="58" class="s">Why clots form, where they travel, what they kill</text><g transform="translate(380 250)"><path d="M-220 -46 L220 -46 L220 46 L-220 46 Z" fill="#7C2F3A"/><path d="M-220 -38 L220 -38 L220 38 L-220 38 Z" fill="#F4D7D3"/><path d="M-60 -38 C-40 -20 -20 -8 -4 -4 L-6 -38 Z M-60 38 C-40 20 -20 8 -4 4 L-6 38 Z" fill="#E7B6AF" stroke="#B9776B" stroke-width="1.2"/><ellipse cx="-200" cy="-3" rx="11" ry="5" fill="url(#rbc)" opacity=".85"/><ellipse cx="-154" cy="-11" rx="11" ry="5" fill="url(#rbc)" opacity=".85"/><ellipse cx="-108" cy="3" rx="11" ry="5" fill="url(#rbc)" opacity=".85"/><ellipse cx="-62" cy="-5" rx="11" ry="5" fill="url(#rbc)" opacity=".85"/><ellipse cx="-16" cy="9" rx="11" ry="5" fill="url(#rbc)" opacity=".85"/><ellipse cx="30" cy="1" rx="11" ry="5" fill="url(#rbc)" opacity=".85"/><ellipse cx="76" cy="-7" rx="11" ry="5" fill="url(#rbc)" opacity=".85"/><ellipse cx="122" cy="7" rx="11" ry="5" fill="url(#rbc)" opacity=".85"/><ellipse cx="168" cy="-1" rx="11" ry="5" fill="url(#rbc)" opacity=".85"/><ellipse cx="214" cy="-9" rx="11" ry="5" fill="url(#rbc)" opacity=".85"/><path d="M-60 -38 C-56 -22 -40 -14 -20 -12 C-6 -12 20 -14 40 -22 C56 -28 72 -34 90 -38 Z" fill="#9E2B24"/><path d="M-50 -36 C-46 -28 -40 -22 -30 -16" stroke="#F1E3C2" stroke-width="2.4" fill="none" opacity=".85"/><path d="M-36 -36 C-32 -28 -26 -22 -16 -16" stroke="#F1E3C2" stroke-width="2.4" fill="none" opacity=".85"/><path d="M-22 -36 C-18 -28 -12 -22 -2 -16" stroke="#F1E3C2" stroke-width="2.4" fill="none" opacity=".85"/><path d="M-8 -36 C-4 -28 2 -22 12 -16" stroke="#F1E3C2" stroke-width="2.4" fill="none" opacity=".85"/><path d="M6 -36 C10 -28 16 -22 26 -16" stroke="#F1E3C2" stroke-width="2.4" fill="none" opacity=".85"/><path d="M20 -36 C24 -28 30 -22 40 -16" stroke="#F1E3C2" stroke-width="2.4" fill="none" opacity=".85"/><path d="M34 -36 C38 -28 44 -22 54 -16" stroke="#F1E3C2" stroke-width="2.4" fill="none" opacity=".85"/><path d="M48 -36 C52 -28 58 -22 68 -16" stroke="#F1E3C2" stroke-width="2.4" fill="none" opacity=".85"/></g><path d="M520 166L460 224" class="ln" stroke-width="1.2" fill="none"/><circle cx="460" cy="224" r="2.6" class="lnf"/><text x="522" y="156" class="n sm">thrombus at a valve pocket;</text><text x="522" y="171" class="n sm">pale and red layers = lines of Zahn</text><path d="M140 132 L140 352 L620 352" class="ln" stroke-width="1.4" stroke-dasharray="4 5" fill="none"/><circle cx="140" cy="122" r="22" class="fred"/><text x="140" y="130" class="h xl red" text-anchor="middle">I</text><text x="172" y="122" class="l b red">Endothelial injury</text><text x="172" y="140" class="n sm">Most important: alone</text><text x="172" y="155" class="n sm">can cause thrombosis</text><circle cx="140" cy="382" r="22" class="fblu"/><text x="140" y="390" class="h xl blu" text-anchor="middle">S</text><text x="172" y="382" class="l b blu">Stasis or turbulence</text><text x="172" y="400" class="n sm">Abnormal flow: blood</text><text x="172" y="415" class="n sm">pooling or swirling</text><circle cx="680" cy="382" r="22" class="fpur"/><text x="680" y="390" class="h xl pur" text-anchor="middle">H</text><text x="614" y="382" class="l b pur" text-anchor="end">Hypercoagulability</text><text x="614" y="400" class="n sm" text-anchor="end">Factor V Leiden (inherited);</text><text x="614" y="415" class="n sm" text-anchor="end">pregnancy, OCPs, cancer,</text><text x="614" y="430" class="n sm" text-anchor="end">immobilisation, surgery</text><text x="380" y="108" class="n sm b" text-anchor="middle">VIRCHOW'S TRIAD</text><rect x="24" y="452" width="348" height="344" rx="14" class="pn"/><rect x="388" y="452" width="348" height="344" rx="14" class="pn"/><text x="40" y="482" class="l b">Embolus: a clot that travels</text><g transform="translate(120 650) scale(1.1)"><path d="M0 -120 C14 -120 20 -108 18 -96 C30 -90 40 -80 40 -60 L40 30 L24 30 L22 120 L6 120 L2 40 L-2 40 L-6 120 L-22 120 L-24 30 L-40 30 L-40 -60 C-40 -80 -30 -90 -18 -96 C-20 -108 -14 -120 0 -120 Z" fill="#E9F0F7" stroke="#9AAFC4" stroke-width="2"/><path d="M-28 -64 C-34 -40 -30 -20 -14 -16 C-6 -30 -8 -56 -14 -66 Z M28 -64 C34 -40 30 -20 14 -16 C6 -30 8 -56 14 -66 Z" fill="#F2B8B3" stroke="#C7766E" stroke-width="1.2"/><path d="M-14 100 C-14 60 -12 30 -4 -2 C0 -20 2 -34 -2 -44" stroke="#4B6FB5" stroke-width="3" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)"/><ellipse cx="-14" cy="92" rx="5" ry="9" fill="#9E2B24"/><path d="M-4 -44 L-18 -50" stroke="#9E2B24" stroke-width="5" stroke-linecap="round"/></g><text x="196" y="534" class="n sm">Pulmonary embolism:</text><text x="196" y="550" class="n sm">commonest embolism;</text><text x="196" y="566" class="n sm">&gt; 95% from deep leg</text><text x="196" y="582" class="n sm">veins (popliteal and</text><text x="196" y="598" class="n sm">above)</text><text x="196" y="640" class="n sm">Saddle embolus at the</text><text x="196" y="656" class="n sm">bifurcation can kill</text><text x="196" y="672" class="n sm">instantly</text><text x="196" y="718" class="n sm">Others: fat (long-bone</text><text x="196" y="734" class="n sm">fractures), air,</text><text x="196" y="750" class="n sm">amniotic fluid</text><text x="404" y="482" class="l b" textLength="316" lengthAdjust="spacingAndGlyphs">Infarct: wedge-shaped, apex at the block</text><g transform="translate(480 590)"><path d="M-40 -60 C-10 -76 40 -60 44 -10 C48 30 30 70 -6 70 C-30 70 -50 50 -40 20 C-30 10 -26 -4 -36 -14 C-50 -26 -54 -50 -40 -60 Z" fill="#B5544B" stroke="#7E3029" stroke-width="2"/><path d="M14 -58 L-14 -6 L40 -24 C38 -40 30 -52 14 -58 Z" fill="#F1E3C2" stroke="#C9A867" stroke-width="1.2"/><path d="M-14 -6 L-30 4" stroke="#7E3029" stroke-width="4"/><circle cx="-14" cy="-6" r="4" fill="#3A1A16"/></g><g transform="translate(650 590)"><path d="M-6 -70 C-30 -66 -50 -30 -50 20 C-50 60 -30 72 -6 66 C4 50 6 -40 -6 -70 Z" fill="#E7A9B4" stroke="#B5687A" stroke-width="2"/><path d="M-36 30 L-12 14 L-20 60 C-30 58 -38 48 -36 30 Z" fill="#8E1F2F" opacity=".85"/><circle cx="-12" cy="14" r="4" fill="#3A1A16"/></g><text x="480" y="690" class="l sm b" text-anchor="middle">White (pale) infarct</text><text x="480" y="708" class="n sm" text-anchor="middle">arterial block in solid</text><text x="480" y="723" class="n sm" text-anchor="middle">organs with end-arteries:</text><text x="480" y="738" class="n sm" text-anchor="middle">heart, kidney, spleen</text><text x="650" y="690" class="l sm b red" text-anchor="middle">Red infarct</text><text x="650" y="708" class="n sm" text-anchor="middle">venous block, loose tissue</text><text x="650" y="723" class="n sm" text-anchor="middle">or dual supply: lung,</text><text x="650" y="738" class="n sm" text-anchor="middle">liver, small intestine</text></svg>