<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="From one experiment to a law: in 1790, while translating Cullen&#x27;s Materia Medica, Hahnemann took Cinchona bark himself and, though healthy, developed symptoms like those it cures; this led to drug proving on healthy people (one pure drug at a time, in the 30th potency, aphorisms 105 to 145) and to the law of similars, similia similibus curentur (aphorism 26)."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="500" rx="18" class="bg"/><text x="24" y="36" class="t">From one experiment to the law of similars</text><text x="24" y="58" class="s">How Cinchona bark started homoeopathy</text><rect x="24" y="76" width="169" height="330" rx="14" class="pn"/><rect x="38" y="92" width="47.6" height="20" rx="10" class="famb"/><text x="61.8" y="106.5" class="l sm b amb" text-anchor="middle">1790</text><g transform="translate(108 190)"><path d="M-50 -24 L0 -14 L50 -24 L50 30 L0 40 L-50 30 Z" fill="#FBF6EA" stroke="#9E927A" stroke-width="2"/><path d="M0 -14 L0 40" stroke="#9E927A" stroke-width="2"/><path d="M-42 -12h32" stroke="#C9BFA6" stroke-width="2"/><path d="M-42 -2h32" stroke="#C9BFA6" stroke-width="2"/><path d="M-42 8h32" stroke="#C9BFA6" stroke-width="2"/><path d="M-42 18h32" stroke="#C9BFA6" stroke-width="2"/><path d="M8 -12h32" stroke="#C9BFA6" stroke-width="2"/><path d="M8 -2h32" stroke="#C9BFA6" stroke-width="2"/><path d="M8 8h32" stroke="#C9BFA6" stroke-width="2"/><path d="M8 18h32" stroke="#C9BFA6" stroke-width="2"/></g><text x="38" y="278" class="l b amb">Translating Cullen</text><text x="38" y="326" class="n sm">Hahnemann is translating</text><text x="38" y="344" class="n sm">Cullen's Materia Medica</text><path d="M184 280L214 280" class="samb" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><rect x="205" y="76" width="169" height="330" rx="14" class="pn"/><rect x="219" y="92" width="84.6" height="20" rx="10" class="fred"/><text x="261.3" y="106.5" class="l sm b red" text-anchor="middle">Self-test</text><g transform="translate(289 190)"><path d="M-40 -6 C-40 -20 30 -24 36 -8 L36 6 C30 -8 -40 -4 -40 10 Z" fill="#8A5A34" stroke="#5E3A1E" stroke-width="1.4"/><ellipse cx="-40" cy="2" rx="6" ry="8" fill="#C79A6A" stroke="#5E3A1E"/><path d="M-20 26 C-10 18 10 18 20 26" stroke="#D33A3F" stroke-width="2" fill="none"/><path d="M-8 34 q8 -6 16 0" stroke="#D33A3F" stroke-width="2" fill="none"/></g><text x="219" y="278" class="l b red">Cinchona on himself</text><text x="219" y="326" class="n sm">He takes Cinchona bark</text><text x="219" y="344" class="n sm">himself, while healthy,</text><text x="219" y="362" class="n sm">and notes what it does</text><path d="M365 280L395 280" class="sred" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><rect x="386" y="76" width="169" height="330" rx="14" class="pn"/><rect x="400" y="92" width="77.2" height="20" rx="10" class="fblu"/><text x="438.6" y="106.5" class="l sm b blu" text-anchor="middle">Provings</text><g transform="translate(470 190)"><g transform="translate(-24 4)"><circle cx="0" cy="-26" r="12" fill="#E7EDF4" stroke="#9AAFC4" stroke-width="2"/><path d="M-20 30 C-20 0 -14 -12 0 -12 C14 -12 20 0 20 30 Z" fill="#E7EDF4" stroke="#9AAFC4" stroke-width="2"/></g><g transform="translate(24 4)"><circle cx="0" cy="-26" r="12" fill="#E7EDF4" stroke="#9AAFC4" stroke-width="2"/><path d="M-20 30 C-20 0 -14 -12 0 -12 C14 -12 20 0 20 30 Z" fill="#E7EDF4" stroke="#9AAFC4" stroke-width="2"/></g><rect x="-6" y="-34" width="12" height="22" rx="4" fill="url(#glass)" stroke="#8FB3C9"/></g><text x="400" y="278" class="l b blu">Test on the healthy</text><text x="400" y="326" class="n sm">One pure drug at a time</text><text x="400" y="344" class="n sm">(§122), 30th potency</text><text x="400" y="362" class="n sm">(§128), §§105–145</text><path d="M546 280L576 280" class="sblu" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><rect x="567" y="76" width="169" height="330" rx="14" class="pn"/><rect x="581" y="92" width="40.2" height="20" rx="10" class="fgrn"/><text x="601.1" y="106.5" class="l sm b grn" text-anchor="middle">Law</text><g transform="translate(651 190)"><path d="M-44 -10 L44 -10 M0 -36 L0 30 M-30 30 L30 30" stroke="#5A6172" stroke-width="3"/><path d="M-58 -10 L-30 -10 L-44 18 Z M30 -10 L58 -10 L44 18 Z" fill="#DDF3E7" stroke="#16824F" stroke-width="2"/><circle cx="0" cy="-38" r="5" fill="#5A6172"/></g><text x="581" y="278" class="l b grn">Similia similibus</text><text x="581" y="296" class="l b grn">curentur</text><text x="581" y="326" class="n sm">A medicine cures the</text><text x="581" y="344" class="n sm">disease whose symptoms</text><text x="581" y="362" class="n sm">it produces (§26)</text><text x="24" y="440" class="n sm">Drug proving (§§21, 105–145): medicinal powers are learnt only by testing on healthy people.</text><text x="24" y="460" class="n sm">Self-proving by a healthy, unprejudiced physician is best (§141).</text><text x="24" y="480" class="n sm">1805: Fragmenta de viribus, the first record of provings (27 drugs).</text></svg>