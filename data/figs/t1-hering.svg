<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 652" width="760" height="652" role="img" aria-label="Hering&#x27;s law of the direction of cure on a human figure: symptoms go from above downwards, from within outwards (inner organs to skin), from more important to less important organs (heart and brain before joints and skin), and in the reverse order of their appearance."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="652" rx="18" class="bg"/><text x="24" y="36" class="t">Hering's law: the direction of cure</text><text x="24" y="58" class="s">Four arrows that tell you the case is healing</text><rect x="24" y="76" width="330" height="540" rx="14" class="pn"/><g transform="translate(190 340) scale(1.4)"><path d="M-32 -76 L-46 -28 L-50 18" stroke="#B7C2D0" stroke-width="19" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 -76 L46 -28 L50 18" stroke="#B7C2D0" stroke-width="19" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 26 L-16 84 L-17 142" stroke="#B7C2D0" stroke-width="25" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 26 L16 84 L17 142" stroke="#B7C2D0" stroke-width="25" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-36 -82 C-20 -90 20 -90 36 -82 L32 -10 C30 14 26 30 0 32 C-26 30 -30 14 -32 -10 Z" fill="#E7EDF4" stroke="#B7C2D0" stroke-width="1.6"/><path d="M-32 -76 L-46 -28 L-50 18" stroke="#E7EDF4" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 -76 L46 -28 L50 18" stroke="#E7EDF4" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 26 L-16 84 L-17 142" stroke="#E7EDF4" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 26 L16 84 L17 142" stroke="#E7EDF4" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="-100" width="12" height="16" fill="#E7EDF4"/><circle cy="-116" r="19" fill="#E7EDF4" stroke="#B7C2D0" stroke-width="1.6"/><path d="M-6 -60 C-18 -72 -30 -56 -6 -36 C18 -56 6 -72 -6 -60 Z" fill="#E46F67" opacity=".9"/><ellipse cx="0" cy="-116" rx="12" ry="9" fill="#C9A6C9" opacity=".9"/><circle cx="-46" cy="-28" r="5" fill="#E8A33D"/><circle cx="46" cy="-28" r="5" fill="#E8A33D"/><circle cx="-16" cy="84" r="5" fill="#E8A33D"/><circle cx="16" cy="84" r="5" fill="#E8A33D"/><path d="M64 -130L64 120" class="sblu" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><path d="M-6 -20L-40 4" class="sgrn" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><path d="M6 -20L40 4" class="sgrn" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ah)"/></g><text x="296" y="148" class="l sm b blu" text-anchor="middle">above</text><text x="296" y="534" class="l sm b blu" text-anchor="middle">downwards</text><rect x="370" y="82" width="366" height="106" rx="14" class="fblu"/><circle cx="394" cy="104" r="13" class="blu" opacity=".9"/><text x="394" y="109" class="l sm b" text-anchor="middle" style="fill:#fff">1</text><text x="416" y="109" class="l b blu">Above downwards</text><text x="386" y="138" class="n sm">Symptoms clear from the head</text><text x="386" y="156" class="n sm">towards the feet</text><rect x="370" y="202" width="366" height="106" rx="14" class="fgrn"/><circle cx="394" cy="224" r="13" class="grn" opacity=".9"/><text x="394" y="229" class="l sm b" text-anchor="middle" style="fill:#fff">2</text><text x="416" y="229" class="l b grn">Within outwards</text><text x="386" y="258" class="n sm">From the inner organs</text><text x="386" y="276" class="n sm">towards the skin</text><rect x="370" y="322" width="366" height="106" rx="14" class="fpur"/><circle cx="394" cy="344" r="13" class="pur" opacity=".9"/><text x="394" y="349" class="l sm b" text-anchor="middle" style="fill:#fff">3</text><text x="416" y="349" class="l b pur">More to less important organs</text><text x="386" y="378" class="n sm">Vital organs (heart, brain) clear</text><text x="386" y="396" class="n sm">before joints and skin</text><rect x="370" y="442" width="366" height="106" rx="14" class="famb"/><circle cx="394" cy="464" r="13" class="amb" opacity=".9"/><text x="394" y="469" class="l sm b" text-anchor="middle" style="fill:#fff">4</text><text x="416" y="469" class="l b amb">Reverse order of appearance</text><text x="386" y="498" class="n sm">The newest symptoms go first,</text><text x="386" y="516" class="n sm">the oldest go last</text><text x="24" y="634" class="n sm" textLength="712" lengthAdjust="spacingAndGlyphs">Constantine Hering (1800–1880), author of the Guiding Symptoms. Use it to judge whether the cure is going the right way.</text></svg>