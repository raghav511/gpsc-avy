<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="A mock page of Kent&#x27;s Repertory: the chapter heading MIND, a rubric in red with remedies printed in three typefaces (bold = 3 marks, italic = 2, roman = 1), and sub-rubrics in the fixed order side, time (morning to midnight), conditions or modalities, extension, location and character; the book runs general to particular, Mind first and Generalities last, with desires, aversions and thirst in Stomach and food aggravations in Generalities."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="640" rx="18" class="bg"/><text x="24" y="36" class="t">Kent's Repertory: how a page works</text><text x="24" y="58" class="s">Grades by typeface; sub-rubrics in a fixed order</text><rect x="24" y="80" width="400" height="534" rx="6" fill="#FBF6EA" stroke="#C9B98E" stroke-width="1.6"/><rect x="24" y="80" width="400" height="534" rx="6" fill="none" stroke="#000" stroke-opacity=".05" stroke-width="8"/><text x="224" y="118" text-anchor="middle" class="l b" style="fill:#2B2418;letter-spacing:4px;font-size:18px">MIND</text><path d="M60 130 H388" stroke="#C9B98E"/><text x="44" y="166" class="l" style="fill:#B3261E;font-weight:800">RUBRIC:</text><text x="122" y="166" style="font:700 14px Georgia,serif;fill:#2B2418">ABC.</text><text x="166" y="166" style="font:italic 14px Georgia,serif;fill:#2B2418">def.,</text><text x="206" y="166" style="font:14px Georgia,serif;fill:#2B2418">ghi., jkl., mno.</text><text x="62" y="196" style="font:14px Georgia,serif;fill:#2B2418">side:</text><text x="160" y="196" style="font:13px Georgia,serif;fill:#6E6250">left · right</text><text x="62" y="222" style="font:14px Georgia,serif;fill:#2B2418">time:</text><text x="160" y="222" style="font:13px Georgia,serif;fill:#6E6250">morning · forenoon · noon · afternoon ·</text><text x="160" y="248" style="font:13px Georgia,serif;fill:#6E6250">evening · night · midnight</text><text x="62" y="274" style="font:14px Georgia,serif;fill:#2B2418">conditions:</text><text x="160" y="274" style="font:13px Georgia,serif;fill:#6E6250">the modalities: &lt; and &gt;</text><text x="62" y="300" style="font:14px Georgia,serif;fill:#2B2418">extension:</text><text x="160" y="300" style="font:13px Georgia,serif;fill:#6E6250">to other parts</text><text x="62" y="326" style="font:14px Georgia,serif;fill:#2B2418">location:</text><text x="160" y="326" style="font:13px Georgia,serif;fill:#6E6250">where exactly</text><text x="62" y="352" style="font:14px Georgia,serif;fill:#2B2418">character:</text><text x="160" y="352" style="font:13px Georgia,serif;fill:#6E6250">the sensation</text><path d="M48 186 V360" stroke="#B3261E" stroke-width="2" stroke-dasharray="3 3"/><text x="44" y="398" style="font:12px Georgia,serif;fill:#6E6250">… then the next rubric, alphabetically</text><text x="224" y="596" text-anchor="middle" style="font:12px Georgia,serif;fill:#8C7E62">— 37 chapters, Mind first, Generalities last —</text><text x="448" y="104" class="h">Reading a page of Kent</text><text x="448" y="132" class="n sm b">GRADES</text><rect x="448" y="140" width="70" height="28" rx="6" class="pn"/><text x="483" y="160" text-anchor="middle" class="l" style="font:700 18px Georgia,serif">ABC.</text><text x="532" y="158" class="l sm">bold = 3 marks</text><rect x="448" y="170" width="70" height="28" rx="6" class="pn"/><text x="483" y="190" text-anchor="middle" class="l" style="font:italic 400 18px Georgia,serif">def.</text><text x="532" y="188" class="l sm">italic = 2 marks</text><rect x="448" y="200" width="70" height="28" rx="6" class="pn"/><text x="483" y="220" text-anchor="middle" class="l" style="font:400 18px Georgia,serif">ghi.</text><text x="532" y="218" class="l sm">roman = 1 mark</text><text x="448" y="270" class="n sm b">SUB-RUBRIC ORDER</text><circle cx="460" cy="291" r="11" class="fred"/><text x="460" y="296" class="l sm b red" text-anchor="middle">1</text><text x="480" y="296" class="l">Side</text><circle cx="460" cy="321" r="11" class="fred"/><text x="460" y="326" class="l sm b red" text-anchor="middle">2</text><text x="480" y="326" class="l">Time</text><circle cx="460" cy="351" r="11" class="fred"/><text x="460" y="356" class="l sm b red" text-anchor="middle">3</text><text x="480" y="356" class="l">Conditions</text><circle cx="460" cy="381" r="11" class="fred"/><text x="460" y="386" class="l sm b red" text-anchor="middle">4</text><text x="480" y="386" class="l">Extension</text><circle cx="460" cy="411" r="11" class="fred"/><text x="460" y="416" class="l sm b red" text-anchor="middle">5</text><text x="480" y="416" class="l">Location</text><circle cx="460" cy="441" r="11" class="fred"/><text x="460" y="446" class="l sm b red" text-anchor="middle">6</text><text x="480" y="446" class="l">Character</text><text x="448" y="498" class="n sm">Plan: general to particular,</text><text x="448" y="516" class="n sm">head to foot (Hahnemann).</text><text x="448" y="534" class="n sm">Desires, aversions, thirst: Stomach.</text><text x="448" y="552" class="n sm">Food aggravations: Generalities.</text><text x="448" y="590" class="n sm">Remedy names on the page are placeholders.</text></svg>