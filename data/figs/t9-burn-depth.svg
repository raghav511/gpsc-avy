rder="stroke" stroke="#FFFFFFC0" stroke-width="3">epidermis</text><text x="32" y="206" class="l sm b" style="fill:#3B2A22" paint-order="stroke" stroke="#FFFFFFC0" stroke-width="3">dermis</text><text x="32" y="270" class="l sm b" style="fill:#3B2A22" paint-order="stroke" stroke="#FFFFFFC0" stroke-width="3">fat</text><text x="32" y="316" class="l sm b" style="fill:#3B2A22" paint-order="stroke" stroke="#FFFFFFC0" stroke-width="3">muscle</text><text x="34.0" y="84" class="l b red">Superficial</text><text x="34.0" y="100" class="n sm">1st degree</text><rect x="28.0" y="378" width="170.0" height="196" rx="14" class="pn"/><text x="38.0" y="400" class="n sm b">REACHES</text><text x="38.0" y="418" class="l sm">Epidermis only</text><text x="38.0" y="444" class="n sm b">LOOKS</text><text x="38.0" y="462" class="l sm">Red, no blisters</text><text x="38.0" y="488" class="n sm b">PAIN</text><text x="38.0" y="506" class="l sm">Painful</text><text x="38.0" y="532" class="n sm b">HEALS</text><text x="38.0" y="550" class="l sm">5–7 days, no scar</text><text x="212.0" y="84" class="l b amb">Superficial partial</text><text x="212.0" y="100" class="n sm">2nd degree</text><rect x="206.0" y="378" width="170.0" height="196" rx="14" class="pn"/><text x="216.0" y="400" class="n sm b">REACHES</text><text x="216.0" y="418" class="l sm">Upper dermis</text><text x="216.0" y="444" class="n sm b">LOOKS</text><text x="216.0" y="462" class="l sm">Blisters, moist, pink</text><text x="216.0" y="488" class="n sm b">PAIN</text><text x="216.0" y="506" class="l sm">Very painful</text><text x="216.0" y="532" class="n sm b">HEALS</text><text x="216.0" y="550" class="l sm">2–3 weeks</text><text x="390.0" y="84" class="l b pur">Deep partial</text><text x="390.0" y="100" class="n sm">thickness</text><rect x="384.0" y="378" width="170.0" height="196" rx="14" class="pn"/><text x="394.0" y="400" class="n sm b">REACHES</text><text x="394.0" y="418" class="l sm">Deep dermis</text><text x="394.0" y="444" class="n sm b">LOOKS</text><text x="394.0" y="462" class="l sm">Pale, mottled</text><text x="394.0" y="488" class="n sm b">PAIN</text><text x="394.0" y="506" class="l sm">Less painful</text><text x="394.0" y="532" class="n sm b">HEALS</text><text x="394.0" y="550" class="l sm">Over 3 weeks, scars</text><text x="568.0" y="84" class="l b ink">Full thickness</text><text x="568.0" y="100" class="n sm">3rd degree</text><rect x="562.0" y="378" width="170.0" height="196" rx="14" class="pn"/><text x="572.0" y="400" class="n sm b">REACHES</text><text x="572.0" y="418" class="l sm">Whole skin</text><text x="572.0" y="444" class="n sm b">LOOKS</text><text x="572.0" y="462" class="l sm" textLength="150" lengthAdjust="spacingAndGlyphs">White/charred, leathery</text><text x="572.0" y="488" class="n sm b">PAIN</text><text x="572.0" y="506" class="l sm">Painless: nerves gone</text><text x="572.0" y="532" class="n sm b">HEALS</text><text x="572.0" y="550" class="l sm">Needs grafting</text><text x="24" y="618" class="n sm">First aid: cool under running tap water for 20 minutes; no ice, butter or oil. Blisters = superficial partial thickness.</text></svg>