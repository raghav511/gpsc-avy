<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 776" width="760" height="776" role="img" aria-label="How potencies are made: insoluble drugs are triturated with sugar of milk, one hour per step made of three 20-minute rounds of grinding and scraping, to the 3C, which is then dissolved in water and alcohol is added (conversion); liquids are diluted one part in a hundred and succussed, either in a fresh vial for every potency (Hahnemannian, official) or in the same vial emptied and refilled (Korsakovian, faster, marked K)."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="776" rx="18" class="bg"/><text x="24" y="36" class="t">From drug to potency</text><text x="24" y="58" class="s">Trituration for solids, succussion for liquids</text><rect x="24" y="76" width="712" height="300" rx="14" class="pn"/><text x="40" y="104" class="l b amb">Solids: TRITURATION with sugar of milk</text><text x="40" y="124" class="n sm">for insoluble drugs: metals, most minerals, many animal products</text><g transform="translate(110 230)"><path d="M-46 -10 L46 -10 C44 22 24 40 0 40 C-24 40 -44 22 -46 -10 Z" fill="#E6E2DA" stroke="#8C877C" stroke-width="2"/><path d="M-24 40 L-30 52 L30 52 L24 40" fill="#D3CEC4" stroke="#8C877C" stroke-width="2"/><ellipse cx="0" cy="-10" rx="46" ry="9" fill="#F7F5F0" stroke="#8C877C" stroke-width="2"/><ellipse cx="0" cy="-8" rx="36" ry="6" fill="#FFFFFF"/><path d="M14 -60 L28 -58 L8 0 C4 6 -6 4 -4 -2 Z" fill="#D3CEC4" stroke="#8C877C" stroke-width="2"/></g><text x="110" y="300" class="h" text-anchor="middle">1C</text><text x="110" y="320" class="n sm" text-anchor="middle">1 hour</text><path d="M166 230L202 230" class="samb" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><g transform="translate(260 230)"><path d="M-46 -10 L46 -10 C44 22 24 40 0 40 C-24 40 -44 22 -46 -10 Z" fill="#E6E2DA" stroke="#8C877C" stroke-width="2"/><path d="M-24 40 L-30 52 L30 52 L24 40" fill="#D3CEC4" stroke="#8C877C" stroke-width="2"/><ellipse cx="0" cy="-10" rx="46" ry="9" fill="#F7F5F0" stroke="#8C877C" stroke-width="2"/><ellipse cx="0" cy="-8" rx="36" ry="6" fill="#FFFFFF"/><path d="M14 -60 L28 -58 L8 0 C4 6 -6 4 -4 -2 Z" fill="#D3CEC4" stroke="#8C877C" stroke-width="2"/></g><text x="260" y="300" class="h" text-anchor="middle">2C</text><text x="260" y="320" class="n sm" text-anchor="middle">1 hour</text><path d="M316 230L352 230" class="samb" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><g transform="translate(410 230)"><path d="M-46 -10 L46 -10 C44 22 24 40 0 40 C-24 40 -44 22 -46 -10 Z" fill="#E6E2DA" stroke="#8C877C" stroke-width="2"/><path d="M-24 40 L-30 52 L30 52 L24 40" fill="#D3CEC4" stroke="#8C877C" stroke-width="2"/><ellipse cx="0" cy="-10" rx="46" ry="9" fill="#F7F5F0" stroke="#8C877C" stroke-width="2"/><ellipse cx="0" cy="-8" rx="36" ry="6" fill="#FFFFFF"/><path d="M14 -60 L28 -58 L8 0 C4 6 -6 4 -4 -2 Z" fill="#D3CEC4" stroke="#8C877C" stroke-width="2"/></g><text x="410" y="300" class="h" text-anchor="middle">3C</text><text x="410" y="320" class="n sm" text-anchor="middle">1 hour</text><text x="260" y="352" class="n sm" text-anchor="middle">each hour = 3 rounds of 20 minutes: grind, then scrape</text><path d="M530 230L574 230" class="sred" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><g transform="translate(640 222)"><path d="M-30 -40 L-30 36 C-30 44 -24 48 -16 48 L16 48 C24 48 30 44 30 36 L30 -40" fill="url(#glass)" stroke="#8FB3C9" stroke-width="2"/><path d="M-28 0 L28 0 L28 36 C28 42 24 46 16 46 L-16 46 C-24 46 -28 42 -28 36 Z" fill="#CFE6F3"/></g><text x="640" y="300" class="n sm" text-anchor="middle">CONVERSION</text><text x="640" y="316" class="n sm" text-anchor="middle">dissolve the 3C in</text><text x="640" y="332" class="n sm" text-anchor="middle">water, then add alcohol</text><text x="640" y="286" class="n"></text><rect x="24" y="392" width="712" height="344" rx="14" class="pn"/><text x="40" y="420" class="l b blu">Liquids: DILUTION + SUCCUSSION (vigorous shaking)</text><text x="40" y="440" class="n sm">centesimal step: 1 part of the previous potency + 99 parts of alcohol, then succussed</text><g transform="translate(90 520) rotate(-20 0 0)"><rect x="-14" y="-35.0" width="28" height="70" rx="8" fill="url(#glass)" stroke="#8FB3C9" stroke-width="1.6"/><rect x="-12" y="0.0" width="24" height="33.0" rx="6" fill="#E9DFA6" opacity=".9"/><rect x="-11" y="-45.0" width="22" height="12" rx="3" fill="#B98A5A" stroke="#7E5A36"/><path d="M20 -20 q8 6 0 12" stroke="#2E68D8" stroke-width="2" fill="none"/><path d="M26 -16 q8 6 0 12" stroke="#2E68D8" stroke-width="2" fill="none"/><path d="M32 -12 q8 6 0 12" stroke="#2E68D8" stroke-width="2" fill="none"/></g><text x="90" y="590" class="n sm" text-anchor="middle">succuss</text><text x="240" y="476" class="l sm b blu">HAHNEMANNIAN (multi-vial)</text><text x="240" y="494" class="n sm">a fresh vial for every potency · official, most accurate</text><g transform="translate(260 548)"><rect x="-14" y="-35.0" width="28" height="70" rx="8" fill="url(#glass)" stroke="#8FB3C9" stroke-width="1.6"/><rect x="-12" y="-7.0" width="24" height="40.0" rx="6" fill="#E9DFA6" opacity=".9"/><rect x="-11" y="-45.0" width="22" height="12" rx="3" fill="#B98A5A" stroke="#7E5A36"/><text x="0" y="53.0" class="l sm b" text-anchor="middle">1C</text></g><path d="M278 548L310 548" class="sblu" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><g transform="translate(330 548)"><rect x="-14" y="-35.0" width="28" height="70" rx="8" fill="url(#glass)" stroke="#8FB3C9" stroke-width="1.6"/><rect x="-12" y="0.0" width="24" height="33.0" rx="6" fill="#F0E8C2" opacity=".9"/><rect x="-11" y="-45.0" width="22" height="12" rx="3" fill="#B98A5A" stroke="#7E5A36"/><text x="0" y="53.0" class="l sm b" text-anchor="middle">2C</text></g><path d="M348 548L380 548" class="sblu" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><g transform="translate(400 548)"><rect x="-14" y="-35.0" width="28" height="70" rx="8" fill="url(#glass)" stroke="#8FB3C9" stroke-width="1.6"/><rect x="-12" y="7" width="24" height="26" rx="6" fill="#F6F1DA" opacity=".9"/><rect x="-11" y="-45.0" width="22" height="12" rx="3" fill="#B98A5A" stroke="#7E5A36"/><text x="0" y="53.0" class="l sm b" text-anchor="middle">3C</text></g><text x="470" y="556" class="h" text-anchor="middle">…</text><text x="240" y="634" class="l sm b pur">KORSAKOVIAN (single-vial)</text><text x="240" y="652" class="n sm">the same vial is emptied and refilled each step · faster, marked K</text><g transform="translate(290 690) scale(0.6)"><rect x="-14" y="-35.0" width="28" height="70" rx="8" fill="url(#glass)" stroke="#8FB3C9" stroke-width="1.6"/><rect x="-12" y="-3.5" width="24" height="36.5" rx="6" fill="#F0E8C2" opacity=".9"/><rect x="-11" y="-45.0" width="22" height="12" rx="3" fill="#B98A5A" stroke="#7E5A36"/></g><path d="M318 676 A26 22 0 1 1 318 704" class="spur" stroke-width="2.4" fill="none" marker-end="url(#ah)"/><text x="380" y="694" class="n sm">empty → refill → succuss → repeat</text><text x="24" y="754" class="n sm" textLength="712" lengthAdjust="spacingAndGlyphs">Ratio per step: X 1 : 10 (Hering) · C 1 : 100 (Hahnemann) · LM 1 : 50,000 (6th edition, 100 succussions).</text></svg>