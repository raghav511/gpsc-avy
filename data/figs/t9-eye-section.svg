<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760" role="img" aria-label="Cross-sections of the eye: a normal eye with a clear lens focusing light on the retina; a cataract with an opaque, cloudy lens that scatters light; and glaucoma with raised pressure pushing on the eye, a narrow angle and a cupped optic disc, with optic disc views of a normal small cup and an enlarged glaucoma cup."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="760" rx="18" class="bg"/><text x="24" y="36" class="t">Cataract and glaucoma</text><text x="24" y="58" class="s">Cataract clouds the lens; glaucoma damages the optic nerve</text><rect x="24" y="76" width="712" height="210" rx="14" class="pn"/><g transform="translate(200 181)"><path d="M-80 -44 A92 92 0 1 1 -80 44 Z" fill="#F6F1E8" stroke="#B9AE9C" stroke-width="2.4"/><path d="M-72 -46 A86 86 0 1 1 -72 46 Z" fill="#EAF4EF"/><path d="M-8 -86 A86 86 0 0 1 -8 86" fill="none" stroke="#D9655B" stroke-width="3"/><path d="M-80 -44 C-104 -30 -106 30 -80 44 L-76 40 C-96 26 -96 -26 -76 -40 Z" fill="#CFE6F3" stroke="#7FA9C4" stroke-width="1.6"/><path d="M-76 -40 C-96 -26 -96 26 -76 40 L-70 40 L-70 -40 Z" fill="#E3F2FA"/><path d="M-76 -46 L-70 -46 L-68 -12 L-74 -12 Z M-76 46 L-70 46 L-68 12 L-74 12 Z" fill="#8A5A34"/><path d="M-70 -50 L-56 -56 L-60 -40 Z M-70 50 L-56 56 L-60 40 Z" fill="#B9776B"/><path d="M-60 -46L-56 -26" stroke="#9AA6AE" stroke-width="1"/><path d="M-60 46L-56 26" stroke="#9AA6AE" stroke-width="1"/><ellipse cx="-56" cy="0" rx="14" ry="30" fill="#F4FAFD" stroke="#93A9B8" stroke-width="1.6"/><path d="M86 -12 C100 -14 120 -16 150 -16 L150 16 C120 16 100 14 86 12 Z" fill="#F1D9A6" stroke=