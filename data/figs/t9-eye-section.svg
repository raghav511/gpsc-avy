ne"/><circle cx="140" cy="418" r="2.6" class="lnf"/><text x="60" y="502" class="n sm b amb" text-anchor="middle">cloudy lens</text><path d="M70 716L128 652" class="ln" stroke-width="1.2" fill="none"/><circle cx="128" cy="652" r="2.6" class="lnf"/><text x="70" y="728" class="n sm b red" text-anchor="middle">narrow angle</text><path d="M330 710L284 628" class="ln" stroke-width="1.2" fill="none"/><circle cx="284" cy="628" r="2.6" class="lnf"/><text x="330" y="724" class="n sm b red" text-anchor="middle">cupped disc</text><g transform="translate(560 686) scale(0.8)"><circle cx="0" cy="0" r="30" fill="#D9655B"/><circle cx="0" cy="0" r="19" fill="#F3C98D"/><circle cx="0" cy="0" r="7" fill="#FFF3D6"/><path d="M2 -7C4 -22 -6 -27 -22 -20M2 7C4 22 -6 27 -22 20" stroke="#A8322B" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="0" y="46" class="n sm" text-anchor="middle">normal cup</text></g><g transform="translate(650 686) scale(0.8)"><circle cx="0" cy="0" r="30" fill="#D9655B"/><circle cx="0" cy="0" r="19" fill="#F3C98D"/><circle cx="0" cy="0" r="16" fill="#FFF3D6"/><path d="M2 -16C4 -22 -6 -27 -22 -20M2 16C4 22 -6 27 -22 20" stroke="#A8322B" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="0" y="46" class="n sm" text-anchor="middle">glaucoma cup</text></g></svg>