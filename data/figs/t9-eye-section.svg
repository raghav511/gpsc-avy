ray="5 4"/><path d="M-40 -6 L20 -30 M-40 0 L30 4 M-40 8 L10 40" stroke="#E5B93B" stroke-width="1.6" stroke-dasharray="2 5" opacity=".7"/></g><text x="400" y="338" class="h xl amb">Cataract</text><text x="400" y="364" class="n">Opacity of the LENS: light scatters</text><text x="400" y="383" class="n">Painless, gradual loss of vision</text><text x="400" y="402" class="n">Commonest cause of blindness in India</text><text x="400" y="421" class="n">Treated by surgery (lens replacement)</text><rect x="24" y="520" width="712" height="210" rx="14" class="pn"/><g transform="translate(200 625)"><path d="M-80 -44 A92 92 0 1 1 -80 44 Z" fill="#F6F1E8" stroke="#B9AE9C" stroke-width="2.4"/><path d="M-72 -46 A86 86 0 1 1 -72 46 Z" fill="#EAF4EF"/><path d="M-8 -86 A86 86 0 0 1 -8 86" fill="none" stroke="#D9655B" stroke-width="3"/><path d="M-80 -44 C-104 -30 -106 30 -80 44 L-76 40 C-96 26 -96 -26 -76 -40 Z" fill="#CFE6F3" stroke="#7FA9C4" stroke-width="1.6"/><path d="M-76 -40 C-96 -26 -96 26 -76 40 L-70 40 L-70 -40 Z" fill="#E3F2FA"/><path d="M-82 -46 C-80 -30 -74 -16 -64 -12 L-62 -16 C-70 -22 -76 -34 -78 -46 Z M-82 46 C-80 30 -74 16 -64 12 L-62 16 C-70 22 -76 34 -78 46 Z" fill="#8A5A34"/><path d="M-70 -50 L-56 -56 L-60 -40 Z M-70 50 L-56 56 L-60 40 Z" fill="#B9776B"/><path d="M-60 -46L-56 -26" stroke="#9AA6AE" stroke-width="1"/><path d="M-60 46L-56 26" stroke="#9AA6AE" stroke-width="1"/><ellipse cx="-56" cy="0" rx="14" ry="30" fill="#F4FAFD" stroke="#93A9B8" stroke-width="1.6"/><path d="M86 -12 C100 -14 120 -16 150 -16 L150 16 C120 16 100 14 86 12 Z" fill="#F1D9A6" stroke="#C9A867" stroke-width="1.6"/><path d="M84 -12 C76 -8 74 8 84 12" fill="#EAF4EF" stroke="#D9655B" stroke-width="2"/><path d="M-13 -13L-38 -28" class="sred" stroke-width="2.2" marker-end="url(#ah)" stroke-linecap="round" opacity=".8"/><path d="M10 -26L10 -56" class="sred" stroke-width="2.2" marker-end="url(#ah)" stroke-linecap="round" opacity=".8"/><path d="M33 -13L58 -28" class="sred" stroke-width="2.2" marker-end