, double chromatin</text><text x="36" y="662" class="n sm b">Gametocyte</text><text x="212" y="662" class="l sm blu">Round</text><text x="452" y="662" class="l sm red">Crescent / banana (diagnostic)</text><rect x="24" y="674" width="712" height="34" rx="8" class="pn"/><text x="36" y="696" class="n sm b">Schizonts in smear</text><text x="212" y="696" class="l sm blu">Seen</text><text x="452" y="696" class="l sm red">Usually not (sequestered)</text><text x="36" y="730" class="n sm b">Fever</text><text x="212" y="730" class="l sm blu">Tertian, 48 h</text><text x="452" y="730" class="l sm red">Malignant tertian; cerebral malaria</text><text x="24" y="786" class="n sm">Relapse: vivax and ovale hide in the liver as hypnozoites → primaquine.</text><text x="24" y="806" class="n sm">Infective to man: sporozoite (mosquito bite). Infective to mosquito: gametocyte.</text><text x="24" y="826" class="n sm">Thick smear detects, thin smear identifies the species (Giemsa, JSB, Leishman).</text></svg>