470" y="316" class="n sm b">LIMITS</text><text x="470" y="336" class="n sm">Ignores grades; one small rubric</text><text x="470" y="354" class="n sm">can wrongly drop the true remedy.</text><text x="470" y="392" class="n sm b">NAMES</text><text x="470" y="412" class="n sm">Guernsey (first, 1888); Field (based</text><text x="470" y="430" class="n sm">on Kent); Boger; Jugal Kishore (India).</text><text x="470" y="448" class="n sm">Marcos Jimenez first graded cards.</text></svg>