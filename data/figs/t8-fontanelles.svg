<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="The newborn skull seen from above: the diamond-shaped anterior fontanelle between the frontal and parietal bones closes by 12 to 18 months; the triangular posterior fontanelle closes by 2 to 3 months; with the sagittal, coronal and lambdoid sutures."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="560" rx="18" class="bg"/><text x="24" y="36" class="t">Fontanelles of the newborn skull</text><text x="24" y="58" class="s">Seen from above</text><g transform="translate(220 300)"><ellipse cx="0" cy="0" rx="120" ry="150" fill="#F1E4CB" stroke="#A8916B" stroke-width="2.4"/><path d="M0 -150 L0 -70 M0 70 L0 136" stroke="#A8916B" stroke-width="2.4"/><path d="M-118 -30 C-80 -54 -40 -66 -26 -70 M118 -30 C80 -54 40 -66 26 -70" stroke="#A8916B" stroke-width="2.4" fill="none"/><path d="M0 -70 L0 70" stroke="#A8916B" stroke-width="2.4"/><path d="M-110 78 C-70 100 -30 124 -12 136 M110 78 C70 100 30 124 12 136" stroke="#A8916B" stroke-width="2.4" fill="none"/><path d="M0 -112 L26 -70 L0 -28 L-26 -70 Z" fill="#9DC3E6" stroke="#2E68D8" stroke-width="2.4"/><path d="M0 124 L14 140 L-14 140 Z" fill="#F2B8B3" stroke="#D33A3F" stroke-width="2.4"/></g><text x="220" y="104" class="n sm b" text-anchor="middle">FRONT (face)</text><text x="220" y="476" class="n sm b" text-anchor="middle">BACK (occiput)</text><path d="M370 160L240 230" class="ln" stroke-width="1.2" fill="none"/><circle cx="240" cy="230" r="2.6" class="lnf"/><text x="380" y="156" class="l b blu">Anterior fontanelle</text><text x="380" y="176" class="n sm">diamond-shaped; closes by 12–18 months</text><path d="M370 420L228 436" class="ln" stroke-width="1.2" fill="none"/><circle cx="228" cy="436" r="2.6" class="lnf"/><text x="380" y="416" class="l b red">Posterior fontanelle</text><text x="380" y="436" class="n sm">triangular; closes by 2–3 months</text><path d="M370 300L222 330" class="ln" stroke-width="1.2" fill="none"/><circle cx="222" cy="330" r="2.6" class="lnf"/><text x="380" y="296" class="l">Sagittal suture</text><text x="380" y="316" class="n sm">between the parietal bones</text><path d="M370 236L300 248" class="ln" stroke-width="1.2" fill="none"/><circle cx="300" cy="248" r="2.6" class="lnf"/><text x="380" y="240" class="l">Coronal suture</text><path d="M370 372L300 392" class="ln" stroke-width="1.2" fill="none"/><circle cx="300" cy="392" r="2.6" class="lnf"/><text x="380" y="376" class="l">Lambdoid suture</text><rect x="380" y="470" width="356" height="66" rx="14" class="pn2"/><text x="394" y="496" class="n sm">Late-closing fontanelles: rickets; in</text><text x="394" y="514" class="n sm">homoeopathy, the Calcarea phosphorica child</text></svg>