<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760" role="img" aria-label="Mechanical injuries drawn on skin: abrasion (only epidermis lost, shows direction), contusion (bleeding under intact skin), laceration (ragged, tissue bridges, bruised edges), incised wound (clean, longer than deep, with a tail), stab wound (deeper than long) and firearm wounds (small inverted entry with abrasion collar and tattooing; larger everted exit), with a strip of bruise colours: red, blue at 1 to 3 days, brown, green at 5 to 6 days, yellow at 7 to 12 days, normal by about 2 weeks."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset=".55" stop-color="#EAD9B8"/><stop offset="1" stop-color="#C9B088"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D7BF"/><stop offset="1" stop-color="#E3B293"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCEBF5"/><stop offset=".5" stop-color="#F7FBFE"/><stop offset="1" stop-color="#C9DDEB"/></linearGradient><radialGradient id="rbc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F6A9A3"/><stop offset=".45" stop-color="#E9746C"/><stop offset="1" stop-color="#C9473F"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="760" rx="18" class="bg"/><text x="24" y="36" class="t">Mechanical injuries: read the wound</text><text x="24" y="58" class="s">What each wound looks like, and how a bruise ages</text><rect x="24" y="76" width="229" height="250" rx="14" class="pn"/><g transform="translate(138 160)"><rect x="-70" y="-50" width="140" height="100" rx="12" fill="url(#skin)"/><path d="M-48 -18 C-20 -26 20 -24 46 -10 C30 6 -10 10 -46 4 Z" fill="#E0796B" opacity=".75"/><path d="M-44 -14l18 -3" stroke="#B6493E" stroke-width="1.5"/><path d="M-35 -9l18 -3" stroke="#B6493E" stroke-width="1.5"/><path d="M-26 -4l18 -3" stroke="#B6493E" stroke-width="1.5"/><path d="M-17 -14l18 -3" stroke="#B6493E" stroke-width="1.5"/><path d="M-8 -9l18 -3" stroke="#B6493E" stroke-width="1.5"/><path d="M1 -4l18 -3" stroke="#B6493E" stroke-width="1.5"/><path d="M10 -14l18 -3" stroke="#B6493E" stroke-width="1.5"/><path d="M19 -9l18 -3" stroke="#B6493E" stroke-width="1.5"/><path d="M28 -4l18 -3" stroke="#B6493E" stroke-width="1.5"/><path d="M37 -14l18 -3" stroke="#B6493E" stroke-width="1.5"/><path d="M40 -12 l14 2 l-4 6" stroke="#B6493E" stroke-width="2" fill="none"/></g><text x="40" y="244" class="l b amb">Abrasion</text><text x="40" y="264" class="n sm">Only the epidermis is lost;</text><text x="40" y="280" class="n sm">shows direction of force;</text><text x="40" y="296" class="n sm">heals without a scar</text><rect x="265" y="76" width="229" height="250" rx="14" class="pn"/><g transform="translate(379 160)"><rect x="-70" y="-50" width="140" height="100" rx="12" fill="url(#skin)"/><ellipse cx="0" cy="0" rx="40" ry="28" fill="#5B4BA0" opacity=".55"/><ellipse cx="4" cy="2" rx="24" ry="16" fill="#3D2F7A" opacity=".55"/></g><text x="281" y="244" class="l b pur">Contusion (bruise)</text><text x="281" y="264" class="n sm">Bleeding under intact skin;</text><text x="281" y="280" class="n sm">its colour dates the injury</text><text x="281" y="296" class="n sm">(strip below)</text><rect x="506" y="76" width="229" height="250" rx="14" class="pn"/><g transform="translate(620 160)"><rect x="-70" y="-50" width="140" height="100" rx="12" fill="url(#skin)"/><ellipse cx="0" cy="3" rx="58" ry="24" fill="#7E5AA8" opacity=".22"/><path d="M-44 -6 L-30 2 L-22 -8 L-10 4 L0 -6 L12 6 L22 -4 L34 4 L46 -4 L34 12 L22 6 L12 16 L0 6 L-10 14 L-22 4 L-30 12 Z" fill="#8E2A2A" stroke="#6A1F1F" stroke-width="1.2"/><path d="M-8 2 L-6 10 M18 0 L20 9" stroke="#E7B9A0" stroke-width="2.4"/></g><text x="522" y="244" class="l b red">Laceration</text><text x="522" y="264" class="n sm">Blunt force tears: ragged</text><text x="522" y="280" class="n sm">margins, tissue bridges,</text><text x="522" y="296" class="n sm">bruised edges</text><rect x="24" y="338" width="229" height="250" rx="14" class="pn"/><g transform="translate(138 422)"><rect x="-70" y="-50" width="140" height="100" rx="12" fill="url(#skin)"/><path d="M-50 -2 C-20 -8 20 -8 50 -2 C20 4 -20 4 -50 -2 Z" fill="#9E2D2D"/><path d="M50 -2 L62 -3" stroke="#9E2D2D" stroke-width="1.2"/><text x="56" y="18" class="n sm" text-anchor="middle">tail</text></g><text x="40" y="506" class="l b blu">Incised wound</text><text x="40" y="526" class="n sm">Sharp edge: clean cut,</text><text x="40" y="542" class="n sm">longer than deep; the tail</text><text x="40" y="558" class="n sm">shows where it ended</text><rect x="265" y="338" width="229" height="250" rx="14" class="pn"/><g transform="translate(379 422)"><rect x="-70" y="-50" width="140" height="100" rx="12" fill="url(#skin)"/><path d="M-12 -4 L12 -4 L14 0 L12 4 L-12 4 L-14 0 Z" fill="#7A2323"/><path d="M-60 34 L60 34" stroke="#8E95A6" stroke-width="1" stroke-dasharray="3 3"/><path d="M-16 0 C-10 20 -4 34 0 46 C4 34 10 20 16 0" fill="none" stroke="#8E95A6" stroke-width="1.4"/></g><text x="281" y="506" class="l b tea">Stab wound</text><text x="281" y="526" class="n sm">Depth greater than length;</text><text x="281" y="542" class="n sm">shape tells a single- or</text><text x="281" y="558" class="n sm">double-edged blade</text><rect x="506" y="338" width="229" height="250" rx="14" class="pn"/><g transform="translate(620 422)"><g transform="translate(-36 0)"><circle r="30" fill="url(#skin)"/><circle cx="15.4" cy="0.0" r="1.3" fill="#2B2B2B"/><circle cx="8.5" cy="16.7" r="1.3" fill="#2B2B2B"/><circle cx="-12.9" cy="17.8" r="1.3" fill="#2B2B2B"/><circle cx="-15.2" cy="-2.4" r="1.3" fill="#2B2B2B"/><circle cx="-5.7" cy="-17.8" r="1.3" fill="#2B2B2B"/><circle cx="15.6" cy="-15.5" r="1.3" fill="#2B2B2B"/><circle cx="14.6" cy="4.8" r="1.3" fill="#2B2B2B"/><circle cx="2.9" cy="18.5" r="1.3" fill="#2B2B2B"/><circle cx="-17.8" cy="12.9" r="1.3" fill="#2B2B2B"/><circle cx="-13.7" cy="-7.0" r="1.3" fill="#2B2B2B"/><circle cx="0.1" cy="-18.7" r="1.3" fill="#2B2B2B"/><circle cx="19.7" cy="-9.9" r="1.3" fill="#2B2B2B"/><circle cx="12.4" cy="9.1" r="1.3" fill="#2B2B2B"/><circle cx="-3.0" cy="18.5" r="1.3" fill="#2B2B2B"/><circle cx="-21.0" cy="6.7" r="1.3" fill="#2B2B2B"/><circle cx="-10.8" cy="-11.0" r="1.3" fill="#2B2B2B"/><circle cx="5.9" cy="-17.7" r="1.3" fill="#2B2B2B"/><circle cx="21.8" cy="-3.3" r="1.3" fill="#2B2B2B"/><circle cx="9.0" cy="12.5" r="1.3" fill="#2B2B2B"/><circle cx="-8.6" cy="16.6" r="1.3" fill="#2B2B2B"/><circle cx="-22.0" cy="-0.2" r="1.3" fill="#2B2B2B"/><circle cx="-6.9" cy="-13.8" r="1.3" fill="#2B2B2B"/><circle cx="11.1" cy="-15.0" r="1.3" fill="#2B2B2B"/><circle cx="21.7" cy="3.7" r="1.3" fill="#2B2B2B"/><circle cx="4.6" cy="14.7" r="1.3" fill="#2B2B2B"/><circle cx="-13.4" cy="13.1" r="1.3" fill="#2B2B2B"/><circle r="11" fill="#6E4A3A" opacity=".8"/><circle r="6" fill="#1E1414"/></g><g transform="translate(40 0)"><circle r="30" fill="url(#skin)"/><path d="M-14 -6 L-6 -10 L-4 -18 L2 -9 L12 -12 L8 -3 L16 4 L6 6 L4 16 L-2 7 L-12 12 L-8 2 Z" fill="#8E2A2A" stroke="#6A1F1F"/></g><text x="-36" y="46" class="n sm" text-anchor="middle">entry</text><text x="40" y="46" class="n sm" text-anchor="middle">exit</text></g><text x="522" y="506" class="l b red">Firearm wound</text><text x="522" y="526" class="n sm">Entry: small, inverted, collar,</text><text x="522" y="542" class="n sm">tattooing at close range.</text><text x="522" y="558" class="n sm">Exit: larger, everted, no collar</text><text x="24" y="616" class="l b">A bruise changes colour as it ages</text><rect x="24" y="630" width="108" height="60" rx="12" fill="url(#skin)"/><ellipse cx="78" cy="660" rx="34" ry="20" fill="#C0392B" opacity=".7"/><text x="78" y="712" class="l sm b" text-anchor="middle">Red</text><text x="78" y="730" class="n sm" text-anchor="middle">fresh</text><path d="M128 660L146 660" class="ln" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><rect x="144" y="630" width="108" height="60" rx="12" fill="url(#skin)"/><ellipse cx="198" cy="660" rx="34" ry="20" fill="#3D3A8C" opacity=".7"/><text x="198" y="712" class="l sm b" text-anchor="middle">Blue</text><text x="198" y="730" class="n sm" text-anchor="middle">1–3 days</text><path d="M248 660L266 660" class="ln" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><rect x="264" y="630" width="108" height="60" rx="12" fill="url(#skin)"/><ellipse cx="318" cy="660" rx="34" ry="20" fill="#7A4B2A" opacity=".7"/><text x="318" y="712" class="l sm b" text-anchor="middle">Brown</text><text x="318" y="730" class="n sm" text-anchor="middle"></text><path d="M368 660L386 660" class="ln" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><rect x="384" y="630" width="108" height="60" rx="12" fill="url(#skin)"/><ellipse cx="438" cy="660" rx="34" ry="20" fill="#5F8F3A" opacity=".7"/><text x="438" y="712" class="l sm b" text-anchor="middle">Green</text><text x="438" y="730" class="n sm" text-anchor="middle">5–6 days</text><path d="M488 660L506 660" class="ln" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><rect x="504" y="630" width="108" height="60" rx="12" fill="url(#skin)"/><ellipse cx="558" cy="660" rx="34" ry="20" fill="#D9B526" opacity=".7"/><text x="558" y="712" class="l sm b" text-anchor="middle">Yellow</text><text x="558" y="730" class="n sm" text-anchor="middle">7–12 days</text><path d="M608 660L626 660" class="ln" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><rect x="624" y="630" width="108" height="60" rx="12" fill="url(#skin)"/><text x="678" y="712" class="l sm b" text-anchor="middle">Normal</text><text x="678" y="730" class="n sm" text-anchor="middle">≈2 weeks</text></svg>