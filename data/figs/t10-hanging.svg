<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-label="Ligature marks on the neck seen from the side: in hanging the mark is oblique, high above the thyroid cartilage and incomplete at the knot, the face is pale and saliva dribbles if hanged alive; in ligature strangulation the mark is horizontal, low at or below the thyroid cartilage and complete, and the face is congested with petechiae."><style> .bg{fill:#FFFCF6}.pn{fill:#F5EFE3}.pn2{fill:#EEF3FB}.ink{fill:#1E2330}.mut{fill:#5A6172}.ln{stroke:#8E95A6}.lnf{fill:#8E95A6} .t{font:700 21px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E2330}.s{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172} .h{font:800 15px system-ui,-apple-system,sans-serif;fill:#1E2330}.l{font:600 14px system-ui,-apple-system,sans-serif;fill:#1E2330} .n{font:400 13.5px system-ui,-apple-system,sans-serif;fill:#5A6172}.b{font-weight:700}.sm{font-size:12.5px}.xl{font-size:25px;font-weight:800} .red{fill:#D33A3F}.blu{fill:#2E68D8}.grn{fill:#16824F}.amb{fill:#B06A00}.pur{fill:#7845C8}.tea{fill:#0B8585} .sred{stroke:#D33A3F}.sblu{stroke:#2E68D8}.sgrn{stroke:#16824F}.samb{stroke:#B06A00}.spur{stroke:#7845C8}.stea{stroke:#0B8585} .fred{fill:#FCE3E3}.fblu{fill:#E1EBFD}.fgrn{fill:#DDF3E7}.famb{fill:#FDF0D9}.fpur{fill:#EEE5FB}.ftea{fill:#DAF2F2} @media (prefers-color-scheme:dark){ .bg{fill:#1A1E28}.pn{fill:#252B39}.pn2{fill:#222A3B}.ink,.l,.t,.h{fill:#ECEFF5}.mut,.n,.s{fill:#A7AFC1}.ln{stroke:#69718A}.lnf{fill:#69718A} .red{fill:#FF7C7F}.blu{fill:#83AAFF}.grn{fill:#5FD39B}.amb{fill:#FFBE5C}.pur{fill:#BB97FF}.tea{fill:#55D3D3} .sred{stroke:#FF7C7F}.sblu{stroke:#83AAFF}.sgrn{stroke:#5FD39B}.samb{stroke:#FFBE5C}.spur{stroke:#BB97FF}.stea{stroke:#55D3D3} .fred{fill:#4A2A2E}.fblu{fill:#26355A}.fgrn{fill:#1F3F31}.famb{fill:#47371C}.fpur{fill:#382A55}.ftea{fill:#1C4243}} </style><defs><linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E2"/><stop offset