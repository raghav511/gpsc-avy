0" y="462" class="n sm b">SALIVA DRIBBLING</text><text x="410" y="480" class="l sm">Absent</text><text x="410" y="506" class="n sm b">USUAL MANNER</text><text x="410" y="524" class="l sm">Homicidal</text><path d="M160 370L60 272" class="ln" stroke-width="1.2" fill="none"/><circle cx="60" cy="272" r="2.6" class="lnf"/><text x="160" y="386" class="n sm" text-anchor="middle">thyroid cartilage</text><text x="24" y="598" class="n sm">Throttling (manual strangulation): finger-nail marks and bruises; hyoid fracture is commonest here.</text></svg>